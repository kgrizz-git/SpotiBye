# SonarQube analysis configuration for local runs (Community Edition)
#
# Run SonarQube locally (Docker):
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#
# Generate coverage first, then scan:
#   # Backend (TS) coverage
#   cd src/backend && npm run test:coverage
#   # Frontend (Python) coverage
#   KIVY_WINDOW=headless KIVY_NO_ENV_CONFIG=1 \
#     .venv/bin/pytest src/frontend/tests/ --cov=src/frontend --cov-report=xml:../../coverage-python.xml
#
# Scan:
#   export SONAR_TOKEN="$(cat .sonar_token)"  # local SonarQube
#   # For SonarQube Cloud: export SONAR_TOKEN="$(cat .sonar_cloud_token)"
#   sonar-scanner -Dsonar.host.url=http://localhost:9000
# See dev-docs/guides/sonarqube-local.md for the full local setup.

sonar.projectKey=kgrizz-git_SpotiBye
sonar.projectName=SpotiBye
sonar.sourceEncoding=UTF-8

# Source roots (Python frontend + TypeScript backend + dev scripts). SonarQube
# auto-detects language by file extension, so a single mixed project is fine.
# `scripts/` holds executed CI/pre-commit code and was previously unscanned.
sonar.sources=src/frontend,src/backend,scripts

# Test roots (kept separate so they are not counted as "new code to fix").
# `scripts/tests` is included as tests to avoid test-specific false positives
# (e.g. S5443 on tmp_path) dragging down the quality gate.
sonar.tests=src/frontend/tests,src/backend/tests,scripts/tests
sonar.test.inclusions=src/frontend/tests/**,src/backend/tests/**,scripts/tests/**

# Exclude build artifacts, deps, caches, and packaging outputs
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/*.spec.ts,\
  build/**,\
  dist/**,\
  tmp/**,\
  packaging/**,\
  spotibye.spec

# Python coverage (pytest xml report, generated before scanning)
sonar.python.coverage.reportPaths=coverage-python.xml

# TypeScript/JavaScript coverage (vitest lcov report, generated before scanning)
sonar.javascript.lcov.reportPaths=src/backend/coverage/lcov.info

# Python version used in the repo
sonar.python.version=3.10
