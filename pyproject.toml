[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotibye"
version = "0.1.3"
description = "Refactored Spotify Playlist Exporter (Kivy desktop)"
authors = [{ name = "Kevin Grizzard" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kivy",
    "kivymd==1.2.0",
    "spotipy",
    "pandas",
    "openpyxl",
    "requests",
    "pillow",
]

[project.optional-dependencies]
development = [
    "black",
    "ruff",
]

[project.scripts]
spotify-playlist-exporter = "spotify_playlist_exporter_v2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
