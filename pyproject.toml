[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotibye"
version = "0.1.5"
description = "Refactored Spotify Playlist Exporter (Kivy desktop)"
authors = [{ name = "Kevin Grizzard" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kivy",
    "kivymd==1.2.0",
    "spotipy>=2.25.2",
    "requests==2.34.1",
    "pillow>=12.2.0",
    "idna>=3.15",
    "pygments>=2.20.0",
]

[project.optional-dependencies]
development = [
    "black",
    "ruff",
    "basedpyright>=1.39.6",
    "bandit[toml]>=1.7.8",
    "pip-audit>=2.7.0",
    "pip-review>=1.3.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pathspec>=0.12",
    "lizard>=1.23.0",
    "radon>=6.0.1",
]

[project.scripts]
spotibye = "frontend.app.backend_app:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
# Kivy's event system (`bind`, `setter`, dynamic widget attributes) isn't
# exposed in the type stubs, so we suppress `reportAttributeAccessIssue` for
# the whole frontend. Real None-access and type-mismatch issues still report
# under their own diagnostic codes and are not silenced by this setting.
#
# Kivy's `Widget.on_touch_*` base class returns `Literal[True] | None` but
# subclasses commonly return `bool`. This is a well-known Kivy typing quirk,
# so we also suppress `reportIncompatibleMethodOverride` for the frontend.
#
# Kivy widgets are routinely declared as `Optional[X]` in `__init__` and
# assigned in `build_ui()`. The pattern produces many false positives for
# `reportOptionalMemberAccess`. The trade-off is acceptable for this desktop
# app because (a) tests catch real None-access bugs at runtime, and
# (b) the Kivy widget pattern is uniform across the codebase. If a real
# None-access bug slips through, suppress it locally with a
# `# pyright: ignore[reportOptionalMemberAccess]` comment and investigate.
#
# Several screens use `TYPE_CHECKING`-only imports of `MainScreen` to type
# their `screen` parameter. The runtime import chain is acyclic, but
# basedpyright reports a logical cycle. We suppress `reportImportCycles`
# for the frontend; real runtime cycles would still surface as test failures.
reportAttributeAccessIssue = "none"
reportIncompatibleMethodOverride = "none"
reportOptionalMemberAccess = "none"
reportImportCycles = "none"

# Keep the type checker out of backup directories, virtual environments, and
# build artifacts. Only `backups/` currently exists; the other backup paths are
# defensive and mirror `[tool.bandit] exclude_dirs` plus the pre-commit exclude
# regex so re-introduced backup dirs stay out of scope.
exclude = [
    "**/backups",
    "**/backend-backup",
    "**/SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY",
    "**/docs/old-docs-backup",
    "**/srcamas",
    "**/.venv",
    "**/venv",
    "**/node_modules",
    "**/build",
    "**/dist",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "backups",
    "backend-backup",
    "SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY",
    "docs/old-docs-backup",
    "srcamas",
]
skips = [
    "B101",
    "B105",
    "B108",
    "B110",
    "B112",
    "B301",
    "B311",
    "B324",
    "B403",
    "B404",
    "B603",
    "B607",
    "B601",
]  # Skip test asserts plus known local-cache/UI false positives for this desktop app
severity = "medium"
confidence = "medium"
