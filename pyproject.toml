[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotibye"
version = "0.1.5"
description = "Refactored Spotify Playlist Exporter (Kivy desktop)"
authors = [{ name = "Kevin Grizzard" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kivy",
    "kivymd==1.2.0",
    "spotipy",
    "pandas",
    "openpyxl",
    "requests",
    "pillow",
]

[project.optional-dependencies]
development = [
    "black",
    "ruff",
    "bandit[toml]>=1.7.8",
    "pip-audit>=2.7.0",
    "pip-review>=1.3.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

[project.scripts]
spotibye = "frontend.app.backend_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "backups",
    "backend-backup",
    "SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY",
    "docs/old-docs-backup",
    "srcamas",
]
skips = [
    "B101",
    "B105",
    "B108",
    "B110",
    "B112",
    "B301",
    "B311",
    "B324",
    "B403",
    "B404",
    "B603",
    "B607",
    "B601",
]  # Skip test asserts plus known local-cache/UI false positives for this desktop app
severity = "medium"
confidence = "medium"
