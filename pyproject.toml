[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotibye"
version = "0.1.5"
description = "Refactored Spotify Playlist Exporter (Kivy desktop)"
authors = [{ name = "Kevin Grizzard" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kivy",
    "kivymd==1.2.0",
    "spotipy",
    "pandas",
    "openpyxl",
    "requests",
    "pillow",
]

[project.optional-dependencies]
development = [
    "black",
    "ruff",
    "bandit[toml]>=1.7.8",
    "pip-audit>=2.7.0",
    "pip-review>=1.3.0",
]

[project.scripts]
spotify-playlist-exporter = "spotify_playlist_exporter_v2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "__pycache__", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert warnings and wildcard imports
severity = "medium"
confidence = "medium"
