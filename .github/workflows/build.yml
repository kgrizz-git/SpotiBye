name: Build Executables

on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (windows, macos, linux)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - macos
        - linux

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || (github.event.inputs.platform == 'windows' && matrix.os == 'windows-latest') || (github.event.inputs.platform == 'macos' && matrix.os == 'macos-latest') || (github.event.inputs.platform == 'linux' && matrix.os == 'ubuntu-latest') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Resolve app version
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          APP_VERSION="${GITHUB_REF#refs/tags/v}"
        else
          APP_VERSION="$(python -c "import pathlib,re; text=pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); m=re.search(r'^version\\s*=\\s*\"([^\"]+)\"', text, re.M); print(m.group(1) if m else '0.0.0')")"
        fi
        echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev python3-pip python3-venv \
          build-essential libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev upx

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        Compress-Archive -Path dist\SpotiBye\* -DestinationPath SpotiBye-Windows-v${{ env.APP_VERSION }}.zip -Force
      shell: pwsh

    - name: Build executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        cd dist
        hdiutil create -volname "SpotiBye" -srcfolder SpotiBye.app -ov -format UDZO SpotiBye-macOS-v${APP_VERSION}.dmg
        cd ..

    - name: Build executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        cd dist
        tar -czvf SpotiBye-Linux-v${APP_VERSION}.tar.gz SpotiBye/
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: SpotiBye-${{ runner.os }}-v${{ env.APP_VERSION }}
        path: |
          ${{ runner.os == 'Windows' && format('SpotiBye-Windows-v{0}.zip', env.APP_VERSION) || '' }}
          ${{ runner.os == 'macOS' && format('dist/SpotiBye-macOS-v{0}.dmg', env.APP_VERSION) || '' }}
          ${{ runner.os == 'Linux' && format('dist/SpotiBye-Linux-v{0}.tar.gz', env.APP_VERSION) || '' }}

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ runner.os == 'Windows' && format('SpotiBye-Windows-v{0}.zip', env.APP_VERSION) || '' }}
          ${{ runner.os == 'macOS' && format('dist/SpotiBye-macOS-v{0}.dmg', env.APP_VERSION) || '' }}
          ${{ runner.os == 'Linux' && format('dist/SpotiBye-Linux-v{0}.tar.gz', env.APP_VERSION) || '' }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
