name: Build Executables

on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (windows, macos, linux)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - macos
        - linux

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    # Set SKIP_BUILD=true when a specific platform is requested and this runner
    # doesn't match. runner.os lowercased matches the platform input values
    # (Windows→windows, macOS→macos, Linux→linux).
    - name: Set platform skip flag
      shell: bash
      env:
        PLATFORM_INPUT: ${{ github.event.inputs.platform }}
        RUNNER_OS: ${{ runner.os }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        PLATFORM="$PLATFORM_INPUT"
        OS_LOWER=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && \
           [[ -n "$PLATFORM" ]] && \
           [[ "$PLATFORM" != "all" ]] && \
           [[ "$OS_LOWER" != "$PLATFORM" ]]; then
          echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
        fi

    - name: Checkout code
      if: env.SKIP_BUILD != 'true'
      uses: actions/checkout@v4

    - name: Set up Python
      if: env.SKIP_BUILD != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Resolve app version
      if: env.SKIP_BUILD != 'true'
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          APP_VERSION="${GITHUB_REF#refs/tags/v}"
        else
          APP_VERSION="$(python -c "import pathlib,re; text=pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); m=re.search(r'^version\\s*=\\s*\"([^\"]+)\"', text, re.M); print(m.group(1) if m else '0.0.0')")"
        fi
        echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"

    - name: Install system dependencies (Linux)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev python3-pip python3-venv \
          build-essential libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev upx

    - name: Install Python dependencies
      if: env.SKIP_BUILD != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary -r requirements.txt
        pip install pyinstaller

    - name: Validate icon assets
      if: env.SKIP_BUILD != 'true'
      shell: bash
      run: |
        ICON_BASE="resources/SpotiBye black edited 1-modified"
        case "${{ runner.os }}" in
          Windows)
            ICON_PATH="${ICON_BASE}.ico"
            ;;
          macOS)
            ICON_PATH="${ICON_BASE}.icns"
            ;;
          Linux)
            ICON_PATH="${ICON_BASE}.png"
            ;;
          *)
            echo "Unsupported runner OS: ${{ runner.os }}"
            exit 1
            ;;
        esac

        if [[ ! -f "$ICON_PATH" ]]; then
          echo "Missing required icon for ${{ runner.os }} build: $ICON_PATH"
          ls -la resources || true
          exit 1
        fi

        echo "Using icon for ${{ runner.os }} build: $ICON_PATH"

    - name: Build executable (Windows)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:KIVY_GL_BACKEND = 'angle_sdl2'
        $env:KIVY_WINDOW = 'sdl2'
        $env:KIVY_NO_ARGS = '1'
        pyinstaller spotibye.spec --noconfirm --clean
        $zipPath = "SpotiBye-Windows-v${{ env.APP_VERSION }}.zip"
        if (Test-Path "dist\SpotiBye") {
          tar -a -c -f $zipPath -C dist SpotiBye
        } elseif (Test-Path "dist\SpotiBye.exe") {
          tar -a -c -f $zipPath -C dist SpotiBye.exe
        } else {
          Write-Error "Expected dist\\SpotiBye directory or dist\\SpotiBye.exe, but neither was found."
          Get-ChildItem -Recurse dist
          exit 1
        }

    - name: Build executable (macOS)
      if: env.SKIP_BUILD != 'true' && runner.os == 'macOS'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        cd dist
        hdiutil create -volname "SpotiBye" -srcfolder SpotiBye.app -ov -format UDZO SpotiBye-macOS-v${APP_VERSION}.dmg
        cd ..

    - name: Build executable (Linux)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Linux'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        PACKAGE_ROOT="dist/SpotiBye-Linux-v${APP_VERSION}"
        rm -rf "$PACKAGE_ROOT"
        mkdir -p "$PACKAGE_ROOT/resources"
        cp -R dist/SpotiBye "$PACKAGE_ROOT/SpotiBye"
        cp "resources/SpotiBye black edited 1-modified.png" "$PACKAGE_ROOT/resources/"
        cp "packaging/linux/SpotiBye.desktop" "$PACKAGE_ROOT/SpotiBye.desktop.template"
        cp "packaging/linux/install-desktop-entry.sh" "$PACKAGE_ROOT/install-desktop-entry.sh"
        chmod +x "$PACKAGE_ROOT/install-desktop-entry.sh"
        tar -czvf "dist/SpotiBye-Linux-v${APP_VERSION}.tar.gz" -C dist "SpotiBye-Linux-v${APP_VERSION}"

    - name: Upload artifact
      if: env.SKIP_BUILD != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: SpotiBye-${{ runner.os }}-v${{ env.APP_VERSION }}
        path: |
          ${{ runner.os == 'Windows' && format('SpotiBye-Windows-v{0}.zip', env.APP_VERSION) || '' }}
          ${{ runner.os == 'macOS' && format('dist/SpotiBye-macOS-v{0}.dmg', env.APP_VERSION) || '' }}
          ${{ runner.os == 'Linux' && format('dist/SpotiBye-Linux-v{0}.tar.gz', env.APP_VERSION) || '' }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
