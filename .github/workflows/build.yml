name: Build Executables

on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (windows, macos, linux)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - macos
        - linux

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    # Set SKIP_BUILD=true when a specific platform is requested and this runner
    # doesn't match. runner.os lowercased matches the platform input values
    # (Windows→windows, macOS→macos, Linux→linux).
    - name: Set platform skip flag
      shell: bash
      run: |
        PLATFORM="${{ github.event.inputs.platform }}"
        OS_LOWER=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
           [[ -n "$PLATFORM" ]] && \
           [[ "$PLATFORM" != "all" ]] && \
           [[ "$OS_LOWER" != "$PLATFORM" ]]; then
          echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
        fi

    - name: Checkout code
      if: env.SKIP_BUILD != 'true'
      uses: actions/checkout@v4

    - name: Set up Python
      if: env.SKIP_BUILD != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Resolve app version
      if: env.SKIP_BUILD != 'true'
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          APP_VERSION="${GITHUB_REF#refs/tags/v}"
        else
          APP_VERSION="$(python -c "import pathlib,re; text=pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); m=re.search(r'^version\\s*=\\s*\"([^\"]+)\"', text, re.M); print(m.group(1) if m else '0.0.0')")"
        fi
        echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"

    - name: Install system dependencies (Linux)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev python3-pip python3-venv \
          build-essential libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev upx

    - name: Install Python dependencies
      if: env.SKIP_BUILD != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable (Windows)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        Compress-Archive -Path dist\SpotiBye\* -DestinationPath SpotiBye-Windows-v${{ env.APP_VERSION }}.zip -Force

    - name: Build executable (macOS)
      if: env.SKIP_BUILD != 'true' && runner.os == 'macOS'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        cd dist
        hdiutil create -volname "SpotiBye" -srcfolder SpotiBye.app -ov -format UDZO SpotiBye-macOS-v${APP_VERSION}.dmg
        cd ..

    - name: Build executable (Linux)
      if: env.SKIP_BUILD != 'true' && runner.os == 'Linux'
      run: |
        pyinstaller spotibye.spec --noconfirm --clean
        cd dist
        tar -czvf SpotiBye-Linux-v${APP_VERSION}.tar.gz SpotiBye/
        cd ..

    - name: Upload artifact
      if: env.SKIP_BUILD != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: SpotiBye-${{ runner.os }}-v${{ env.APP_VERSION }}
        path: |
          ${{ runner.os == 'Windows' && format('SpotiBye-Windows-v{0}.zip', env.APP_VERSION) || '' }}
          ${{ runner.os == 'macOS' && format('dist/SpotiBye-macOS-v{0}.dmg', env.APP_VERSION) || '' }}
          ${{ runner.os == 'Linux' && format('dist/SpotiBye-Linux-v{0}.tar.gz', env.APP_VERSION) || '' }}

    - name: Create Release
      if: env.SKIP_BUILD != 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ runner.os == 'Windows' && format('SpotiBye-Windows-v{0}.zip', env.APP_VERSION) || '' }}
          ${{ runner.os == 'macOS' && format('dist/SpotiBye-macOS-v{0}.dmg', env.APP_VERSION) || '' }}
          ${{ runner.os == 'Linux' && format('dist/SpotiBye-Linux-v{0}.tar.gz', env.APP_VERSION) || '' }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
