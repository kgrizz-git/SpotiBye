name: Security Scan

on:
  # Only run security scans on PRs to main/develop, not every push
  # This reduces redundant runs while maintaining security on important branches
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.json'
      - 'requirements.txt'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/security.yml'
  # Weekly security scan on main branch
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret Scanning
  secret-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for TruffleHog to scan history

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        # Only run commit diff mode on PRs; for schedule/dispatch, scan full history
        if: github.event_name == 'pull_request'

      - name: TruffleHog OSS (Full History)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
        # Run full history scan on schedule/dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

  # SAST - Multi-language (JavaScript, TypeScript, Python)
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/ci
            p/secrets
            p/javascript
            p/typescript
            p/python

  # Python SAST - Bandit (only on Python file changes to reduce redundancy)
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    # Only run if Python files were changed
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.changed_files, '.py') ||
      contains(github.event.pull_request.changed_files, 'requirements.txt')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Display Bandit results
        run: bandit -r src/ -f txt || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          retention-days: 30
          path: bandit-report.json

  # Dependency Scanning - Python
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --requirement=requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Display pip-audit results
        run: pip-audit --requirement=requirements.txt || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          retention-days: 30
          path: pip-audit-report.json

  # Dependency Scanning - Node.js (only on Node.js file changes)
  npm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    # Only run if Node.js dependencies changed
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.changed_files, 'package') ||
      contains(github.event.pull_request.changed_files, '.js') ||
      contains(github.event.pull_request.changed_files, '.ts')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run npm audit
        working-directory: src/backend
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (JSON output)
        working-directory: src/backend
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          retention-days: 30
          path: src/backend/npm-audit-report.json

  # Infrastructure as Code Scanning (if wrangler.toml exists)
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if wrangler.toml exists
        id: check_file
        run: |
          if [ -f "src/backend/wrangler.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkov Scan
        if: steps.check_file.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: src/backend/
          framework: cloudformation,terraform
          output_format: sarif
          output_file_path: reports/checkov.sarif

  # Summary
  security-summary:
    name: Security Summary
    needs: [secret-scan, semgrep, bandit, pip-audit, npm-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security Check Summary
        run: |
          {
            echo "## Security Scan Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Secret Scan (TruffleHog) | ${{ needs.secret-scan.result }} |"
            echo "| SAST (Semgrep) | ${{ needs.semgrep.result }} |"
            echo "| Python SAST (Bandit) | ${{ needs.bandit.result }} |"
            echo "| Python Dependencies (pip-audit) | ${{ needs.pip-audit.result }} |"
            echo "| Node.js Dependencies (npm-audit) | ${{ needs.npm-audit.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
