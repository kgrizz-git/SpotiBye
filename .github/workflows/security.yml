name: Security Scan

on:
  # Only run security scans on PRs to main/develop, not every push
  # This reduces redundant runs while maintaining security on important branches
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.json'
      - 'requirements.txt'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/security.yml'
  # Weekly security scan on main branch
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single sequential runner: parallel short jobs each bill 1 minute; one job
# keeps the same scanners while cutting billable minutes ~6x → 1–2x per run.
jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # TruffleHog PR Diff Mode — no --exclude-paths. A PR-scoped exclude file
      # would let the same PR widen exclusions and hide secrets from this gate.
      # Lob false positives only appear in full-history scans (below).
      - name: TruffleHog Secret Scan (PR Diff)
        id: trufflehog_pr
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # TruffleHog Full History Mode (Schedule / Manual Dispatch).
      # --exclude-paths applies only here: weekly history scans hit Lob FPs on
      # unittest names matching test_ + 35 chars (trufflesecurity/trufflehog#5184).
      - name: TruffleHog Secret Scan (Full History)
        id: trufflehog_full
        if: (success() || failure()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          extra_args: --debug --only-verified --exclude-paths .trufflehog-exclude.txt

      # Semgrep SAST — pass rules via -e only (do not also pass --config;
      # CLI --config overrides/ignores SEMGREP_RULES).
      - name: Semgrep SAST
        id: semgrep
        if: success() || failure()
        run: |
          docker run --rm \
            -e SEMGREP_RULES="p/security-audit p/owasp-top-ten p/cwe-top-25 p/ci p/secrets p/javascript p/typescript p/python" \
            -v "${PWD}:/src" \
            semgrep/semgrep semgrep ci

      - name: Set up Python
        if: success() || failure()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'

      - name: Bandit Python SAST
        id: bandit
        if: success() || failure()
        run: |
          # Pin + wheels-only: avoids Sonar githubactions findings on unlocked
          # versions and setup.py execution from sdists (S8543 / S8544).
          pip install --only-binary=:all: "bandit[toml]==1.9.4"
          bandit -r src/ scripts/ -c pyproject.toml -f txt

      - name: OSV-Scanner Dependency Check
        id: osv
        if: success() || failure()
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
        with:
          # OSV-Scanner honours .gitignore by default, so .venv/, node_modules/,
          # backups/, and docs/old-docs-backup/ are skipped without extra flags.
          #
          # This sub-action always exits non-zero when vulns are found (no
          # fail-on-vuln knob at this layer; the reusable workflow offers one).
          # Keep a per-directory osv-scanner.toml with [[IgnoredVulns]] entries
          # (each carrying a reason + ignoreUntil expiry) for advisories that
          # land in unpatchable transitive deps, rather than suppressing the
          # step. SARIF results are still uploaded to Code Scanning either way.
          scan-args: |-
            -r
            ./

      - name: IaC Security Check (Checkov)
        id: checkov
        if: (success() || failure()) && hashFiles('src/backend/wrangler.toml') != ''
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0
        with:
          directory: src/backend/
          framework: cloudformation,terraform

      # Note: step.outcome is 'skipped' (truthy) when a step's if: is false,
      # so do not use || between PR and full-history TruffleHog outcomes.
      - name: Generate Security Scan Summary
        if: always()
        env:
          TRUFFLEHOG_PR: ${{ steps.trufflehog_pr.outcome }}
          TRUFFLEHOG_FULL: ${{ steps.trufflehog_full.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
          OSV: ${{ steps.osv.outcome }}
          CHECKOV: ${{ steps.checkov.outcome }}
        run: |
          if [ "${TRUFFLEHOG_PR}" != "skipped" ] && [ -n "${TRUFFLEHOG_PR}" ]; then
            TRUFFLEHOG_OUTCOME="${TRUFFLEHOG_PR}"
          elif [ "${TRUFFLEHOG_FULL}" != "skipped" ] && [ -n "${TRUFFLEHOG_FULL}" ]; then
            TRUFFLEHOG_OUTCOME="${TRUFFLEHOG_FULL}"
          else
            TRUFFLEHOG_OUTCOME="skipped"
          fi
          {
            echo "## Security Scan Results"
            echo "| Security Scanner | Outcome |"
            echo "|---|---|"
            echo "| TruffleHog Secret Scan | ${TRUFFLEHOG_OUTCOME} |"
            echo "| Semgrep SAST | ${SEMGREP:-skipped} |"
            echo "| Bandit Python SAST | ${BANDIT:-skipped} |"
            echo "| OSV-Scanner | ${OSV:-skipped} |"
            echo "| Checkov IaC Scan | ${CHECKOV:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
