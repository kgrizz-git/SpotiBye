name: Security Scan

on:
  # Only run security scans on PRs to main/develop, not every push
  # This reduces redundant runs while maintaining security on important branches
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.json'
      - 'requirements.txt'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/security.yml'
  # Weekly security scan on main branch
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret Scanning
  secret-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Required for TruffleHog to scan history

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        # Only run commit diff mode on PRs; for schedule/dispatch, scan full history
        if: github.event_name == 'pull_request'

      - name: TruffleHog OSS (Full History)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          path: ./
          extra_args: --debug --only-verified
        # Run full history scan on schedule/dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

  # SAST - Multi-language (JavaScript, TypeScript, Python)
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Semgrep scan
        run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/ci
            p/secrets
            p/javascript
            p/typescript
            p/python

  # Python SAST - Bandit (only on Python file changes to reduce redundancy)
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r src/ scripts/ -c pyproject.toml -f json -o bandit-report.json

      - name: Display Bandit results
        run: bandit -r src/ scripts/ -c pyproject.toml -f txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bandit-report
          retention-days: 30
          path: bandit-report.json

  # Dependency Scanning (Python + Node.js via OSV-Scanner)
  dependency-scan:
    name: Dependency Vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5
        with:
          # OSV-Scanner honours .gitignore by default, so .venv/, node_modules/,
          # backups/, and docs/old-docs-backup/ are skipped without extra flags.
          scan-args: |-
            -r
            ./

  # Infrastructure as Code Scanning (if wrangler.toml exists)
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check if wrangler.toml exists
        id: check_file
        run: |
          if [ -f "src/backend/wrangler.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkov Scan
        if: steps.check_file.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@a7683e7b72a04503521247973281ec8142e1ac1f
        with:
          directory: src/backend/
          framework: cloudformation,terraform
          output_format: sarif
          output_file_path: reports/checkov.sarif

  # Summary
  security-summary:
    name: Security Summary
    needs: [secret-scan, semgrep, bandit, dependency-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security Check Summary
        run: |
          {
            echo "## Security Scan Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Secret Scan (TruffleHog) | ${{ needs.secret-scan.result }} |"
            echo "| SAST (Semgrep) | ${{ needs.semgrep.result }} |"
            echo "| Python SAST (Bandit) | ${{ needs.bandit.result }} |"
            echo "| Dependencies (OSV-Scanner) | ${{ needs.dependency-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
