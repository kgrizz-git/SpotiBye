name: Security Scan

on:
  # PRs to main/develop/WIP (path-filtered), every push to main, and a weekly
  # full-history run. Push runs give each merge its own scan.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.json'
      - 'requirements.txt'
      # CI installs from pyproject.toml, so a dependency-only change there
      # must not skip the scan the way it did before this filter was widened.
      - 'pyproject.toml'
      - 'package*.json'
      - 'src/**'
      # Any workflow or composite-action change, so a pin bump anywhere
      # (including Dependabot github-actions PRs) gets the zizmor check.
      - '.github/workflows/**'
      - '.github/actions/**'
      # Scanned config (dependabot.yml) and the pinned Semgrep image, so a
      # cooldown change or an image bump runs the scan before merge.
      - '.github/dependabot.yml'
      - '.github/docker/**'
  # Weekly security scan on main branch
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# Push runs are keyed on their commit so a queued merge scan is never replaced
# by a later one (a group keeps only one pending run); PR runs still cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single sequential runner: parallel short jobs each bill 1 minute; one job
# keeps the same scanners while cutting billable minutes ~6x → 1–2x per run.
jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # TruffleHog Diff Mode (PR, or push to main) — no --exclude-paths. A
      # PR-scoped exclude file would let the same PR widen exclusions and hide
      # secrets from this gate. Lob false positives only appear in full-history
      # scans (below). On push the base is the pre-push commit; on PR it is the
      # default branch. Forced or branch-creation pushes have no usable base and
      # use the full-history step instead.
      - name: TruffleHog Secret Scan (Diff)
        id: trufflehog_pr
        if: >-
          (success() || failure()) && (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && !github.event.forced &&
          github.event.before != '0000000000000000000000000000000000000000'))
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # TruffleHog Full History Mode (Schedule / Manual Dispatch, and pushes
      # whose diff base is unusable).
      # --exclude-paths applies only here: weekly history scans hit Lob FPs on
      # unittest names matching test_ + 35 chars (trufflesecurity/trufflehog#5184).
      - name: TruffleHog Secret Scan (Full History)
        id: trufflehog_full
        if: >-
          (success() || failure()) && (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' || (github.event_name == 'push' &&
          (github.event.forced ||
          github.event.before == '0000000000000000000000000000000000000000')))
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          path: ./
          extra_args: --debug --only-verified --exclude-paths .trufflehog-exclude.txt

      # Semgrep SAST — pass rules via -e only (do not also pass --config;
      # CLI --config overrides/ignores SEMGREP_RULES).
      # Image is pinned (tag + digest) in .github/docker/semgrep/Dockerfile so
      # Dependabot's docker ecosystem can bump it; rule packs are still fetched
      # from the registry at run time.
      - name: Semgrep SAST
        id: semgrep
        if: success() || failure()
        run: |
          SEMGREP_IMAGE="$(sed -n 's/^FROM[[:space:]]\{1,\}//p' .github/docker/semgrep/Dockerfile)"
          if [ -z "${SEMGREP_IMAGE}" ]; then
            echo "::error::No FROM line in .github/docker/semgrep/Dockerfile"
            exit 1
          fi
          # Run as the runner's (non-root) user instead of the image default
          # (root); HOME=/tmp gives semgrep a writable home for its settings.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e SEMGREP_RULES="p/security-audit p/owasp-top-ten p/cwe-top-25 p/ci p/secrets p/javascript p/typescript p/python" \
            -v "${PWD}:/src" \
            "${SEMGREP_IMAGE}" semgrep ci

      - name: Set up Python
        if: success() || failure()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # zizmor (installed below) requires Python >=3.11.
          python-version: '3.13'

      - name: Bandit Python SAST
        id: bandit
        if: success() || failure()
        run: |
          # Pin + wheels-only: avoids Sonar githubactions findings on unlocked
          # versions and setup.py execution from sdists (S8543 / S8544).
          pip install --only-binary=:all: "bandit[toml]==1.9.4"
          bandit -r src/ scripts/ -c pyproject.toml -f txt

      - name: OSV-Scanner Dependency Check
        id: osv
        if: success() || failure()
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          # OSV-Scanner honours .gitignore by default, so .venv/, node_modules/,
          # backups/, and docs/old-docs-backup/ are skipped without extra flags.
          #
          # This sub-action always exits non-zero when vulns are found (no
          # fail-on-vuln knob at this layer; the reusable workflow offers one).
          # Keep a per-directory osv-scanner.toml with [[IgnoredVulns]] entries
          # (each carrying a reason + ignoreUntil expiry) for advisories that
          # land in unpatchable transitive deps, rather than suppressing the
          # step. SARIF results are still uploaded to Code Scanning either way.
          scan-args: |-
            -r
            ./

      - name: IaC Security Check (Checkov)
        id: checkov
        if: (success() || failure()) && hashFiles('src/backend/wrangler.toml') != ''
        uses: bridgecrewio/checkov-action@29be5868bfa968f099ae80169f61f42887494b8f
        with:
          directory: src/backend/
          framework: cloudformation,terraform

      # Dependabot alerts are never raised for actions pinned by commit SHA
      # (only for semver tags), so check pinned actions against GitHub's
      # advisory database here. zizmor resolves each SHA to its release tag.
      # Only the known-vulnerable-actions audit fails the step; other zizmor
      # findings are out of scope for this check. Kept as steps in this job
      # (not a separate job) per the single-runner billing note above.
      - name: Install zizmor
        if: success() || failure()
        run: "pip install --only-binary=:all: zizmor==1.31.0"

      - name: Check actions against GitHub security advisories
        id: zizmor
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without a token zizmor silently skips its online audits (including
          # known-vulnerable-actions) and would pass; fail closed instead.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; zizmor would skip its online audits"
            exit 1
          fi
          set +e
          zizmor --format=json . > "$RUNNER_TEMP/zizmor.json"
          rc=$?
          set -e
          # 0 = no findings, 10-14 = findings by severity; anything else
          # (e.g. 1) means the audit itself failed, which must not pass.
          if [ "$rc" -ne 0 ] && { [ "$rc" -lt 10 ] || [ "$rc" -gt 14 ]; }; then
            echo "::error::zizmor failed (exit $rc)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import sys

          findings = [
              f for f in json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "zizmor.json")))
              if f["ident"] == "known-vulnerable-actions" and not f.get("ignored")
          ]
          for f in findings:
              loc = (f.get("locations") or [{}])[0]
              key = loc.get("symbolic", {}).get("key", {})
              path = key.get("Local", {}).get("verbatim_path", "?") if isinstance(key, dict) else "?"
              line = loc.get("concrete", {}).get("location", {}).get("start_point", {}).get("row", 0) + 1
              note = loc.get("symbolic", {}).get("annotation", "")
              print(f"::error file={path},line={line}::{f['desc']}: {note}")
          print(f"{len(findings)} known-vulnerable action reference(s)")
          sys.exit(1 if findings else 0)
          PY

      # Note: step.outcome is 'skipped' (truthy) when a step's if: is false,
      # so do not use || between PR and full-history TruffleHog outcomes.
      - name: Generate Security Scan Summary
        if: always()
        env:
          TRUFFLEHOG_PR: ${{ steps.trufflehog_pr.outcome }}
          TRUFFLEHOG_FULL: ${{ steps.trufflehog_full.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
          OSV: ${{ steps.osv.outcome }}
          CHECKOV: ${{ steps.checkov.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
        run: |
          if [ "${TRUFFLEHOG_PR}" != "skipped" ] && [ -n "${TRUFFLEHOG_PR}" ]; then
            TRUFFLEHOG_OUTCOME="${TRUFFLEHOG_PR}"
          elif [ "${TRUFFLEHOG_FULL}" != "skipped" ] && [ -n "${TRUFFLEHOG_FULL}" ]; then
            TRUFFLEHOG_OUTCOME="${TRUFFLEHOG_FULL}"
          else
            TRUFFLEHOG_OUTCOME="skipped"
          fi
          {
            echo "## Security Scan Results"
            echo "| Security Scanner | Outcome |"
            echo "|---|---|"
            echo "| TruffleHog Secret Scan | ${TRUFFLEHOG_OUTCOME} |"
            echo "| Semgrep SAST | ${SEMGREP:-skipped} |"
            echo "| Bandit Python SAST | ${BANDIT:-skipped} |"
            echo "| OSV-Scanner | ${OSV:-skipped} |"
            echo "| Checkov IaC Scan | ${CHECKOV:-skipped} |"
            echo "| zizmor Known-Vulnerable Actions | ${ZIZMOR:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
