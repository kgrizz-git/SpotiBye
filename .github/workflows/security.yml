name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Secret Scanning
  secret-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for TruffleHog to scan history

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # SAST - Multi-language (JavaScript, TypeScript, Python)
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/ci
            p/secrets
            p/javascript
            p/typescript
            p/python

  # Python SAST - Bandit
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Display Bandit results
        run: bandit -r src/ -f txt || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # Dependency Scanning - Python
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --requirement=requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Display pip-audit results
        run: pip-audit --requirement=requirements.txt || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # Dependency Scanning - Node.js
  npm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run npm audit
        working-directory: src/backend
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (JSON output)
        working-directory: src/backend
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: src/backend/npm-audit-report.json

  # Infrastructure as Code Scanning (if wrangler.toml exists)
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if wrangler.toml exists
        id: check_file
        run: |
          if [ -f "src/backend/wrangler.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkov Scan
        if: steps.check_file.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: src/backend/
          framework: cloudformation,terraform
          output_format: sarif
          output_file_path: reports/checkov.sarif

  # Summary
  security-summary:
    name: Security Summary
    needs: [secret-scan, semgrep, bandit, pip-audit, npm-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security Check Summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan (TruffleHog) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SAST (Bandit) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Dependencies (pip-audit) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Dependencies (npm-audit) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
