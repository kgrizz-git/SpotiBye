name: Deploy Backend

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths: ['src/backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  deployments: write
  security-events: read

jobs:
  # Only run tests if triggered manually or if CI hasn't run yet
  # This avoids duplicate test runs when CI already validated the code
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request != null
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Run tests
      working-directory: src/backend
      run: npm run test:run
      env:
        ENVIRONMENT: test
        JWT_SECRET: test-jwt-secret-for-testing-only
        SPOTIFY_CLIENT_ID: test-client-id
        SPOTIFY_CLIENT_SECRET: test-client-secret

    - name: Run linting
      working-directory: src/backend
      run: echo "Linting skipped temporarily - ESLint configuration issues" # npm run lint

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: development
    # Deploy on main branch push or manual trigger, but allow skipped test job
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Deploy to Cloudflare Workers (Development)
      working-directory: src/backend
      run: npm run deploy:dev
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    # Deploy on version tags, but allow skipped test job
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name == 'push' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Deploy to Cloudflare Workers (Production)
      working-directory: src/backend
      run: npm run deploy:prod
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
