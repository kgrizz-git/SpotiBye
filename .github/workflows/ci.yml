name: CI

on:
  # Only run on PRs to main/develop and pushes to these branches
  push:
    branches: [main, develop, WIP]
  pull_request:
    branches: [main, develop, WIP]

jobs:
  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

  frontend:
    name: Frontend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[development]"

      - name: Test
        env:
          # Prevent kivy from trying to initialize SDL2/OpenGL on this headless runner.
          # Without these, importing kivy.uix widgets calls sys.exit() (code 102) and
          # kills pytest before any tests run. Tests that require a real window are
          # skipped via KIVY_DISPLAY_AVAILABLE checks in the test files.
          KIVY_WINDOW: headless
          KIVY_NO_ENV_CONFIG: "1"
        run: pytest src/frontend/tests/ -v
