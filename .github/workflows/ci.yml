name: CI

on:
  # Only run on PRs to main/develop and pushes to these branches
  push:
    branches: [main, develop, WIP]
  pull_request:
    branches: [main, develop, WIP]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

  frontend:
    name: Frontend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[development]"  # NOSONAR(S8541): Kivy/KivyMD need source builds on Linux; --only-binary breaks wheels

      - name: File length check
        run: python scripts/check_file_lengths.py --ci --exemptions scripts/file-length-exemptions.json

      - name: File length exemptions monitoring
        run: python scripts/check_file_lengths.py --exemptions scripts/file-length-exemptions.json --count-only

      - name: Test
        env:
          # Prevent kivy from trying to initialize SDL2/OpenGL on this headless runner.
          # Without these, importing kivy.uix widgets calls sys.exit() (code 102) and
          # kills pytest before any tests run. Tests that require a real window are
          # skipped via KIVY_DISPLAY_AVAILABLE checks in the test files.
          KIVY_WINDOW: headless
          KIVY_NO_ENV_CONFIG: "1"
        run: pytest src/frontend/tests/ -v
