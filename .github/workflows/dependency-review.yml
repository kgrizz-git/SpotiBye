name: OSV PR Scan

on:
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'package*.json'
      - 'package-lock.json'
      - 'src/backend/package*.json'
      - '.github/workflows/dependency-review.yml'

  merge_group:
    branches: [main, develop, WIP]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OSV's PR-diff workflow gives dependency PRs a blocking "new
  # vulnerabilities introduced by this branch" check. Post-merge dependency
  # coverage comes from the OSV step in security.yml (push to main).
  scan-pr:
    name: Dependency Vulnerabilities (OSV PR)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
    with:
      # The repo is public and Code Scanning is enabled, so findings are
      # uploaded as SARIF alongside the blocking check.
      upload-sarif: true
