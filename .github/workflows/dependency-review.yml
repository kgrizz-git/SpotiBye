name: Dependency Review

on:
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - 'requirements.txt'
      - 'package*.json'
      - 'src/backend/package*.json'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Streamlined dependency review using GitHub's built-in action
  # This provides license compliance and vulnerability checks without duplicating security.yml
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate
          # Show all vulnerabilities, not just those in the PR
          allow-ghsas: true
          # Comment on PR with results
          comment-summary-in-pr: always
          # Check for license issues
          deny-licenses: ''
          # Fail on scoped packages
          fail-on-scopes: runtime, development
