name: OSV PR Scan

on:
  pull_request:
    branches: [main, develop, WIP]
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'package*.json'
      - 'package-lock.json'
      - 'src/backend/package*.json'
      - '.github/workflows/dependency-review.yml'

  merge_group:
    branches: [main, develop, WIP]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Private personal repos cannot use actions/dependency-review-action.
  # Use OSV's PR-diff workflow instead so dependency PRs still get a blocking
  # "new vulnerabilities introduced by this branch" check.
  scan-pr:
    name: Dependency Vulnerabilities (OSV PR)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@ffa0a5f39214d80778c9b494822d94d0d9668458
    with:
      # Private personal repos here do not have GitHub Code Scanning enabled,
      # so uploading SARIF via github/codeql-action/upload-sarif will fail.
      upload-sarif: false
