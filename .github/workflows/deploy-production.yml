name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      skip_security_checks:
        description: 'Skip security checks (emergency only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  deployments: write

jobs:
  security-checks:
    name: Security Verification
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_security_checks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Run tests
      working-directory: src/backend
      run: npm run test:run
      env:
        ENVIRONMENT: test
        JWT_SECRET: test-jwt-secret-for-testing-only
        SPOTIFY_CLIENT_ID: test-client-id
        SPOTIFY_CLIENT_SECRET: test-client-secret

    - name: Run linting
      working-directory: src/backend
      run: echo "Linting skipped temporarily - ESLint configuration issues" # npm run lint

  deploy-prod:
    needs: [test, security-checks]
    if: always() && needs.test.result == 'success' && (needs.security-checks.result == 'success' || needs.security-checks.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: write
      deployments: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Deploy to Cloudflare Workers (Production)
      working-directory: src/backend
      run: npm run deploy:prod
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
