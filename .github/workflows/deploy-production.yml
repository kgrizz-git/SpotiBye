name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      skip_security_checks:
        description: 'Skip security checks (emergency only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-checks:
    name: Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.skip_security_checks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Run tests
      working-directory: src/backend
      run: npm run test:run
      env:
        ENVIRONMENT: test
        JWT_SECRET: test-jwt-secret-for-testing-only
        SPOTIFY_CLIENT_ID: test-client-id
        SPOTIFY_CLIENT_SECRET: test-client-secret

    - name: Run linting
      working-directory: src/backend
      run: npm run lint

  deploy-prod:
    needs: [test, security-checks]
    if: always() && needs.test.result == 'success' && (needs.security-checks.result == 'success' || needs.security-checks.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Deploy to Cloudflare Workers (Production)
      working-directory: src/backend
      run: npm run deploy:prod
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
