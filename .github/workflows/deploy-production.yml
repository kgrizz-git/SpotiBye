name: Deploy Production

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Run tests
      working-directory: src/backend
      run: npm run test:run
      env:
        ENVIRONMENT: test
        JWT_SECRET: test-jwt-secret-for-testing-only
        SPOTIFY_CLIENT_ID: test-client-id
        SPOTIFY_CLIENT_SECRET: test-client-secret
        RECOCOBEATS_API_KEY: test-reccobeats-key

    - name: Run linting
      working-directory: src/backend
      run: echo "Linting skipped temporarily - ESLint configuration issues" # npm run lint

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: src/backend
      run: npm ci

    - name: Deploy to Cloudflare Workers (Production)
      working-directory: src/backend
      run: npm run deploy:prod
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Update worker version
      working-directory: src/backend
      run: |
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "Deploying version $VERSION"
        
        echo "Deployment Info:" > deployment-info.txt
        echo "Version: $VERSION" >> deployment-info.txt
        echo "Commit: ${{ github.sha }}" >> deployment-info.txt
        echo "Timestamp: $(date -u)" >> deployment-info.txt
        echo "Environment: production" >> deployment-info.txt

    - name: Upload deployment info
      uses: actions/upload-artifact@v4
      with:
        name: deployment-info-${{ github.sha }}
        path: src/backend/deployment-info.txt
        retention-days: 30
