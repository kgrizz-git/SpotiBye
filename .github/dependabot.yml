version: 2

# Dependabot configuration for SpotiBye project
# Monitors Python (pip), Node.js (npm), GitHub Actions, and the Semgrep scanner image (docker)

updates:
  # Python dependencies - Main project
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 10 * *" # 09:00 on the 10th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 3 # nosemgrep: dependabot-missing-cooldown -- deliberate; see maintenance-log 2026-10-15
    open-pull-requests-limit: 5
    reviewers:
      - "kgrizz-git"
    assignees:
      - "kgrizz-git"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: "auto"
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node.js dependencies - Backend
  - package-ecosystem: "npm"
    directory: "/src/backend"
    schedule:
      interval: "cron"
      cronjob: "0 9 10 * *" # 09:00 on the 10th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 3 # nosemgrep: dependabot-missing-cooldown -- deliberate; see maintenance-log 2026-10-15
    open-pull-requests-limit: 5
    reviewers:
      - "kgrizz-git"
    assignees:
      - "kgrizz-git"
    labels:
      - "dependencies"
      - "javascript"
      - "backend"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group development dependencies
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 10 * *" # 09:00 on the 10th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 3 # nosemgrep: dependabot-missing-cooldown -- deliberate; see maintenance-log 2026-10-15
    open-pull-requests-limit: 5
    reviewers:
      - "kgrizz-git"
    assignees:
      - "kgrizz-git"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Semgrep scanner image (pinned in .github/docker/semgrep/Dockerfile,
  # consumed by the Semgrep SAST step in .github/workflows/security.yml)
  - package-ecosystem: "docker"
    directory: "/.github/docker/semgrep"
    schedule:
      interval: "cron"
      cronjob: "0 9 10 * *" # 09:00 on the 10th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 3 # nosemgrep: dependabot-missing-cooldown -- deliberate; see maintenance-log 2026-10-15
    open-pull-requests-limit: 2
    reviewers:
      - "kgrizz-git"
    assignees:
      - "kgrizz-git"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

# Security updates configuration
# Enable automated security updates (separate from version updates)
# Note: This requires enabling "Dependabot security updates" in GitHub repo settings

# Ignore rules (if needed for known problematic updates)
# ignore:
#   - dependency-name: "some-package"
#     versions: ["3.x", "4.x"]
#     update-types: ["version-update:semver-major"]
