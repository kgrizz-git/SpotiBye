name = "spotibye-backend"
main = "index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE_KV"
id = "cache_kv_namespace_id"
preview_id = "cache_kv_preview_id"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "sessions_kv_namespace_id"
preview_id = "sessions_kv_preview_id"

# Environment-specific configuration
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }

# Secrets (to be set via wrangler secret put)
# SPOTIFY_CLIENT_ID
# SPOTIFY_CLIENT_SECRET
# JWT_SECRET
# RECOCOBEATS_API_KEY
