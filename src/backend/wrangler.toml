name = "spotibye-backend"
main = "index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
ENVIRONMENT = "development"
ALLOWED_REDIRECT_URIS = "http://localhost:3000,http://localhost:3000/callback,http://localhost:8080,http://127.0.0.1:8080/callback"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE_KV"
id = "f7c8b2527ab540548210382ac94514e7"
preview_id = "93fe695dd3b4494dbb566e316031d431"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "656074c3b2dd4400ba74f888b3337d40"
preview_id = "df6d2b4394de4335a385f97003fa986d"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "spotibye-analysis"

[[queues.consumers]]
queue = "spotibye-analysis"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "spotibye-analysis-dlq"

# Environment-specific configuration
[env.development]
vars = { ENVIRONMENT = "development", ALLOWED_REDIRECT_URIS = "http://localhost:3000,http://localhost:3000/callback,http://localhost:8080,http://127.0.0.1:8080/callback" }

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "f7c8b2527ab540548210382ac94514e7"
preview_id = "93fe695dd3b4494dbb566e316031d431"

[[env.development.kv_namespaces]]
binding = "SESSIONS_KV"
id = "656074c3b2dd4400ba74f888b3337d40"
preview_id = "df6d2b4394de4335a385f97003fa986d"

[[env.development.queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "spotibye-analysis-dev"

[[env.development.queues.consumers]]
queue = "spotibye-analysis-dev"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "spotibye-analysis-dev-dlq"

[env.production]
vars = { ENVIRONMENT = "production", ALLOWED_REDIRECT_URIS = "https://app.spotibye.com" }

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "f7c8b2527ab540548210382ac94514e7"
preview_id = "93fe695dd3b4494dbb566e316031d431"

[[env.production.kv_namespaces]]
binding = "SESSIONS_KV"
id = "656074c3b2dd4400ba74f888b3337d40"
preview_id = "df6d2b4394de4335a385f97003fa986d"

[[env.production.queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "spotibye-analysis"

[[env.production.queues.consumers]]
queue = "spotibye-analysis"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "spotibye-analysis-dlq"

# Secrets (to be set via wrangler secret put)
# SPOTIFY_CLIENT_ID
# SPOTIFY_CLIENT_SECRET
# JWT_SECRET
