name = "spotibye-backend"
main = "index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
ENVIRONMENT = "development"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE_KV"
id = "f7c8b2527ab540548210382ac94514e7"
