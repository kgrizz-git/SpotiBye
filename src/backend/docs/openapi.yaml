openapi: 3.0.3
info:
  title: SpotiBye API
  description: >-
    Cloudflare Workers backend (Hono) for SpotiBye: Spotify OAuth (PKCE),
    playlist reads, asynchronous playlist analysis with ReccoBeats
    enrichment, and playlist export to CSV, JSON, or XLSX.


    Success responses use a `{ data, meta? }` envelope. Error responses use
    `{ error: { code, message, ... } }`. Authenticated routes expect an
    app-issued JWT (from `GET /auth/spotify/callback`) as a Bearer token.
  version: 1.0.0
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://spotibye-backend-production.{subdomain}.workers.dev
    description: Production Worker (`spotibye-backend-production`)
    variables:
      subdomain:
        default: your-subdomain
        description: Your Cloudflare account's workers.dev subdomain
  - url: https://spotibye-backend-development.{subdomain}.workers.dev
    description: Development Worker (`spotibye-backend-development`)
    variables:
      subdomain:
        default: your-subdomain
        description: Your Cloudflare account's workers.dev subdomain
  - url: http://localhost:8787
    description: Local `wrangler dev` server

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check and deployment metadata
      description: >-
        Returns service health plus the deployment metadata used by
        `scripts/backend-deploy-status.sh`. Release fields are `"unknown"`
        when the corresponding Worker vars are unset. No authentication.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy response
                  value:
                    data:
                      status: healthy
                      service: spotibye-backend
                      environment: production
                      release_sha: "5c07151"
                      release_version: "1.0.0"
                      deployed_at: "2026-10-25T12:00:00.000Z"
                      timestamp: "2026-10-25T12:30:00.000Z"

  /auth/spotify/login:
    post:
      tags:
        - Authentication
      summary: Initiate Spotify OAuth (PKCE) flow
      description: >-
        Validates `redirect_uri` against the `ALLOWED_REDIRECT_URIS`
        allowlist (exact match, fail-closed when unset), generates `state`
        and a PKCE verifier, stores them in KV for 10 minutes, and returns
        the Spotify authorization URL.
      operationId: spotifyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotifyLoginRequest'
            examples:
              standard:
                summary: Standard login request
                value:
                  redirect_uri: "http://127.0.0.1:8080/callback"
      responses:
        '200':
          description: OAuth URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotifyLoginResponse'
              examples:
                success:
                  summary: Successful login initiation
                  value:
                    data:
                      auth_url: "https://accounts.spotify.com/authorize?response_type=code&client_id=...&code_challenge_method=S256&code_challenge=..."
                      state: "generated-state-string"
        '400':
          description: >-
            Missing or empty `redirect_uri` (`MISSING_REDIRECT_URI`), or a
            `redirect_uri` not in the allowlist (`DISALLOWED_REDIRECT_URI`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to initiate OAuth flow (`OAUTH_INIT_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/spotify/callback:
    get:
      tags:
        - Authentication
      summary: Handle Spotify OAuth callback
      description: >-
        Looks up the stored `state`, exchanges `code` for Spotify tokens
        using the stored PKCE verifier, creates a server-side session, and
        returns an app-issued JWT. The `state` entry is single-use.
      operationId: spotifyCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code from Spotify. Required unless `error` is present.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: State returned by `POST /auth/spotify/login`. Required unless `error` is present.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Error parameter Spotify sends when the user denies access or OAuth fails
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotifyCallbackResponse'
              examples:
                success:
                  summary: Successful authentication
                  value:
                    data:
                      token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        id: "user-123"
                        display_name: "Test User"
                        email: "test@example.com"
                        images: []
                      expires_in: 2592000
                      spotify_access_expires_in: 3600
        '400':
          description: >-
            Spotify returned `error` (`OAUTH_ERROR`), or `code`/`state` is
            missing, unknown, or expired (`INVALID_CALLBACK`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Token exchange or profile fetch failed. Code is
            `OAUTH_TOKEN_EXPIRED`, `OAUTH_BAD_REQUEST` (Spotify 4xx), or
            `OAUTH_CALLBACK_FAILED`; `details.reason` carries the upstream
            message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/spotify/refresh:
    post:
      tags:
        - Authentication
      summary: Re-issue the app JWT
      description: >-
        Issues a fresh app JWT for the current session. The Spotify access
        token itself is refreshed transparently by the auth middleware on any
        authenticated request once it expires.
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found (`SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to refresh token (`TOKEN_REFRESH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Deletes the server-side session.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    data:
                      message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to logout (`LOGOUT_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns the user context decoded from the JWT.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to get user info (`USER_INFO_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists:
    get:
      tags:
        - Spotify Data
      summary: Get all of the user's playlists
      description: >-
        Fetches every page of the user's playlists from Spotify (50 per
        page) and returns them as one array. Results are cached per user for
        5 minutes; `meta.cached` is `true` on a cache hit. Takes no
        pagination parameters.
      operationId: getUserPlaylists
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Playlists retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistsResponse'
        '401':
          description: >-
            Missing/invalid JWT or session (see `Unauthorized`), or Spotify
            rejected the access token (`SPOTIFY_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Spotify rate-limited the request (`SPOTIFY_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch playlists (`PLAYLISTS_FETCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists/{id}:
    get:
      tags:
        - Spotify Data
      summary: Get playlist details
      description: >-
        Returns the Spotify playlist object, cached per user for 10 minutes.
        Any upstream failure (including a Spotify 404) is reported as 500
        `PLAYLIST_FETCH_FAILED`.
      operationId: getPlaylist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/ForceRefresh'
      responses:
        '200':
          description: Playlist details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            Missing/invalid JWT or session (see `Unauthorized`), or Spotify
            rejected the access token (`SPOTIFY_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Spotify rate-limited the request (`SPOTIFY_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch playlist (`PLAYLIST_FETCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists/{id}/items:
    get:
      tags:
        - Spotify Data
      summary: Get playlist items
      description: >-
        Returns one page of playlist items (Spotify February 2026 `/items`
        naming). Each entry's track is normalized into `track`, and entries
        without a track ID are dropped. Cached per user and page for 5
        minutes.
      operationId: getPlaylistItems
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ForceRefresh'
      responses:
        '200':
          description: Playlist items retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItemsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            Missing/invalid JWT or session (see `Unauthorized`), or Spotify
            rejected the access token (`SPOTIFY_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Spotify rate-limited the request (`SPOTIFY_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch playlist items (`PLAYLIST_TRACKS_FETCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists/{id}/tracks:
    get:
      tags:
        - Spotify Data
      summary: Get playlist items (legacy alias)
      description: Backward-compatible alias of `GET /spotify/playlists/{id}/items`, with identical behavior.
      operationId: getPlaylistTracks
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ForceRefresh'
      responses:
        '200':
          description: Playlist items retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItemsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            Missing/invalid JWT or session (see `Unauthorized`), or Spotify
            rejected the access token (`SPOTIFY_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Spotify rate-limited the request (`SPOTIFY_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch playlist items (`PLAYLIST_TRACKS_FETCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/tracks/{id}:
    get:
      tags:
        - Spotify Data
      summary: Get track details
      description: Returns the Spotify track object, cached for 1 hour.
      operationId: getTrack
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify track ID
      responses:
        '200':
          description: Track retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            Missing/invalid JWT or session (see `Unauthorized`), or Spotify
            rejected the access token (`SPOTIFY_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Spotify rate-limited the request (`SPOTIFY_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch track (`TRACK_FETCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}:
    post:
      tags:
        - Analysis
      summary: Start (or resume) playlist analysis
      description: >-
        Starts an asynchronous ReccoBeats + Spotify playlist analysis job
        (via Cloudflare Queues) and returns its status record. By default,
        if a job for this playlist is already queued, actively processing
        (started under 5 minutes ago), or completed with results matching
        the current schema_version, that existing status is returned instead
        of enqueuing a duplicate job. A completed status whose results are
        missing or predate the current schema_version is treated as stale:
        it is purged and a fresh job is enqueued.


        `force_enrichment` and `refresh` may be sent in the JSON body or as
        query parameters (`true` or `1`); either source enables the option.
        Both bypass the short-circuit above. `force_enrichment` also clears
        the user's status/results and the per-track ReccoBeats cache for the
        playlist's tracks. `refresh` keeps the per-track cache and current
        results, so only untried track IDs hit the network.
      operationId: analyzePlaylist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - name: force_enrichment
          in: query
          required: false
          schema:
            type: string
            enum: ['true', '1', 'false', '0']
          description: Query-string alternative to the body `force_enrichment` flag
        - name: refresh
          in: query
          required: false
          schema:
            type: string
            enum: ['true', '1', 'false', '0']
          description: Query-string alternative to the body `refresh` flag
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: Current or newly-queued job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStartResponse'
              examples:
                queued:
                  summary: Newly queued job
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: queued
                      queued_at: "2026-07-07T12:00:00.000Z"
                      progress: 0
                    meta:
                      timestamp: "2026-07-07T12:00:00.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to start analysis (`ANALYSIS_START_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Analysis
      summary: Delete analysis
      description: >-
        Deletes the user's analysis status and results for this playlist.
        Global per-track ReccoBeats cache entries are not cleared.
      operationId: deleteAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Analysis deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    data:
                      message: Analysis deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to delete analysis (`ANALYSIS_DELETE_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}/status:
    get:
      tags:
        - Analysis
      summary: Get analysis job status
      description: Returns the current status record for the most recent analysis job on this playlist for the authenticated user.
      operationId: getAnalysisStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Current job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStartResponse'
              examples:
                processing:
                  summary: Job in progress
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: processing
                      progress: 65
                    meta:
                      timestamp: "2026-07-07T12:00:05.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No analysis found for this playlist (`ANALYSIS_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get analysis status (`ANALYSIS_STATUS_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}/results:
    get:
      tags:
        - Analysis
      summary: Get analysis results
      description: >-
        Returns the completed analysis result for this playlist. Results
        missing `schema_version`, or whose `schema_version` predates the
        server's current version, are purged (both the results and job
        status KV entries) and reported as ANALYSIS_RESULTS_NOT_FOUND so the
        client re-triggers a fresh analysis via POST.
      operationId: getAnalysisResults
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      responses:
        '200':
          description: Completed analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultsResponse'
              examples:
                success:
                  summary: Completed analysis with ReccoBeats enrichment
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: completed
                      computed_at: "2026-07-07T12:00:00.000Z"
                      completed_at: "2026-07-07T12:00:10.000Z"
                      overview:
                        total_tracks: 100
                        total_duration_ms: 21600000
                        average_duration_ms: 216000
                        formatted_duration: "6h 0m 0s"
                      artists:
                        unique_artists: 42
                        top_artists:
                          - artist: "Artist One"
                            count: 8
                          - artist: "Artist Two"
                            count: 5
                        diversity: 0.42
                      genre_distribution:
                        Pop:
                          count: 30
                          percentage: 30.0
                        Electronic:
                          count: 20
                          percentage: 20.0
                      audio_features:
                        track_count: 100
                        averages:
                          acousticness: 0.25
                          danceability: 0.82
                          energy: 0.75
                          instrumentalness: 0.15
                          liveness: 0.2
                          loudness: -6.0
                          speechiness: 0.05
                          tempo: 128.5
                          valence: 0.68
                        key_mode_distribution:
                          key_percentages:
                            C: 42.0
                            G: 30.0
                          dominant_key: "C"
                          dominant_key_percentage: 42.0
                          mode_percentages:
                            major: 70.0
                            minor: 30.0
                          dominant_mode: major
                      insights:
                        - "Top genres: Pop, Electronic."
                      reccobeats_metadata:
                        isrc_available: 95
                        popularity_min: 20
                        popularity_max: 90
                        retrieved_at: "2026-07-07T12:00:09.000Z"
                      errors: []
                      schema_version: "1.1"
                      unique_track_count: 100
                      audio_features_resolved_count: 100
                      track_metadata_resolved_count: 98
                      enrichment_resolved_track_count: 98
                    meta:
                      timestamp: "2026-07-07T12:00:11.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No results found, or cached results are stale (`ANALYSIS_RESULTS_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get analysis results (`ANALYSIS_RESULTS_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlist/{id}:
    post:
      tags:
        - Export
      summary: Export a single playlist
      description: >-
        Generates the export synchronously and returns the completed status
        record. The file bytes are pre-built and cached for 1 hour; fetch
        them from `GET /export/playlist/{id}/download`. If a completed
        export with the same format and enrichment option is already cached,
        that record is returned without regenerating.
      operationId: exportPlaylist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            examples:
              csv:
                summary: CSV export with ReccoBeats enrichment columns
                value:
                  format: "csv"
                  include_audio_features: true
      responses:
        '200':
          description: Export generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleExportStatusResponse'
              examples:
                success:
                  summary: Completed export
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: completed
                      started_at: "2026-07-07T12:00:00.000Z"
                      completed_at: "2026-07-07T12:00:04.000Z"
                      progress: 100
                      file_url: "/export/playlist/playlist-123/download"
                      file_format: csv
                      include_audio_features: true
                      file_size: 1024000
                      track_count: 100
                    meta:
                      timestamp: "2026-07-07T12:00:04.000Z"
                      request_id: "req-123"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '500':
          description: Export failed (`EXPORT_FAILED` or `EXPORT_START_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ExportCpuLimited'
    delete:
      tags:
        - Export
      summary: Delete cached single-playlist export
      description: >-
        Clears the cached single-export artifacts (status, data, and file
        bytes for every format variant). Resumable job and batch keys are
        not cleared.
      operationId: deletePlaylistExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Export deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    data:
                      message: Export deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to delete export (`EXPORT_DELETE_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlist/{id}/status:
    get:
      tags:
        - Export
      summary: Get single-playlist export status
      description: Returns the status record of the most recent single export for this playlist.
      operationId: getPlaylistExportStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleExportStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Export not found (`EXPORT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get export status (`EXPORT_STATUS_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlist/{id}/download:
    get:
      tags:
        - Export
      summary: Download single-playlist export file
      description: >-
        Returns the file for the most recent single export of this playlist,
        in the format it was generated with. Serves the pre-built bytes when
        cached, otherwise regenerates them from cached export data.
      operationId: downloadPlaylistExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          $ref: '#/components/responses/ExportFile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '404':
          description: Export data not found or expired (`EXPORT_DATA_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '503':
          description: Download failed (`EXPORT_DOWNLOAD_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlists:
    post:
      tags:
        - Export
      summary: Export multiple playlists into one file
      description: >-
        Generates a combined export for all `playlist_ids` in a single
        request and returns the completed status record. CSV and JSON bytes
        are pre-built; XLSX is rendered on download. For large selections
        prefer `POST /export/playlists/chunk` or `POST /export/jobs`.
      operationId: exportPlaylistsBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExportRequest'
      responses:
        '200':
          description: Combined export generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExportStatusResponse'
        '400':
          $ref: '#/components/responses/InvalidPlaylists'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '500':
          description: Combined export failed (`EXPORT_BATCH_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ExportCpuLimited'

  /export/playlists/chunk:
    post:
      tags:
        - Export
      summary: Process one chunk of a combined export
      description: >-
        Processes up to `chunk_size` playlists (1-3) starting at `cursor`
        and persists progress under `job_id`. Repeat the call with the
        returned `job_id` and `next_cursor` while `continuation_required` is
        true. Once complete, download from
        `GET /export/playlists/{jobId}/download`.
      operationId: exportPlaylistsChunk
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExportChunkRequest'
      responses:
        '200':
          description: Chunk processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExportStatusResponse'
        '400':
          $ref: '#/components/responses/InvalidPlaylists'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '500':
          description: Chunk failed (`EXPORT_BATCH_CHUNK_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ExportCpuLimited'

  /export/playlists/{jobId}/status:
    get:
      tags:
        - Export
      summary: Get combined export status
      operationId: getBatchExportStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Combined export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExportStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Combined export not found (`EXPORT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get status (`EXPORT_STATUS_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlists/{jobId}/download:
    get:
      tags:
        - Export
      summary: Download combined export file
      operationId: downloadBatchExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          $ref: '#/components/responses/ExportFile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '404':
          description: Combined export data not found (`EXPORT_DATA_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '503':
          description: Download failed (`EXPORT_DOWNLOAD_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/jobs:
    post:
      tags:
        - Export
      summary: Create a resumable export job
      description: >-
        Creates a resumable export job in the `collect` phase and returns
        its state. Drive it with `POST /export/jobs/{jobId}/step` until
        `status` is `completed`, then download.
      operationId: createExportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExportRequest'
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          $ref: '#/components/responses/InvalidPlaylists'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Failed to create job (`EXPORT_JOB_CREATE_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/jobs/{jobId}/step:
    post:
      tags:
        - Export
      summary: Advance a resumable export job by one step
      description: >-
        Runs one collect or assemble step. `cursor` and `resume_token` must
        match the job's `current_cursor` and `current_resume_token`;
        otherwise the call fails with 409 `EXPORT_JOB_CONFLICT` and
        `details.latest_cursor` / `details.latest_resume_token`. When the
        job completes, file bytes are pre-built.
      operationId: stepExportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobStepRequest'
      responses:
        '200':
          description: Updated job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '404':
          description: Export job not found (`EXPORT_JOB_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale cursor or resume token (`EXPORT_JOB_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '500':
          description: Step failed (`EXPORT_JOB_STEP_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ExportCpuLimited'

  /export/jobs/{jobId}/status:
    get:
      tags:
        - Export
      summary: Get resumable export job status
      description: >-
        Returns the job state plus `available_render_modes`, which reports
        which pre-built file variants exist.
      operationId: getExportJobStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Export job not found (`EXPORT_JOB_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get job status (`EXPORT_JOB_STATUS_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/jobs/{jobId}/download:
    get:
      tags:
        - Export
      summary: Download resumable export file
      description: >-
        Returns the completed job's file. For XLSX, `mode` selects the rich
        or lite rendering; `auto` uses the job's `render_mode_hint`. If a
        rich render fails on regeneration, the lite render is returned with
        an `X-SpotiBye-Render-Warning` header.
      operationId: downloadExportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/TraceId'
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [auto, rich, lite]
            default: auto
          description: XLSX render mode. Ignored for CSV and JSON.
      responses:
        '200':
          description: Export file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="playlists_export_<timestamp>.<ext>"'
            X-SpotiBye-Render-Mode:
              schema:
                type: string
              description: Render mode actually served (`rich`, `lite`, `auto`, or `csv`). Not set on every fallback path.
            X-SpotiBye-Render-Warning:
              schema:
                type: string
              description: Present when XLSX rendering degraded to lite
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ExportUpstreamUnauthorized'
        '404':
          description: Export job data not found (`EXPORT_DATA_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job not completed yet (`EXPORT_NOT_READY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ExportRateLimited'
        '503':
          description: Download failed (`EXPORT_JOB_DOWNLOAD_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App-issued JWT returned as `data.token` by
        `GET /auth/spotify/callback` (or `data.access_token` by
        `POST /auth/spotify/refresh`). It references a server-side session
        that holds the Spotify tokens.

  parameters:
    PlaylistId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: Spotify playlist ID
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: Export job ID returned by the create/chunk call
    ForceRefresh:
      name: force_refresh
      in: query
      required: false
      schema:
        type: string
        enum: ['true', '1', 'false', '0']
      description: '`true` or `1` skips the backend KV cache and refetches from Spotify'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 50
      description: Maximum number of items to return
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Offset for pagination
    TraceId:
      name: X-SpotiBye-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client trace ID, echoed into logs and error details

  responses:
    Unauthorized:
      description: >-
        Missing or invalid Bearer token, or expired/invalid session
        (`UNAUTHORIZED`), or the Spotify refresh token was revoked
        (`AUTH_REQUIRED`). Produced by the auth middleware via the global
        error handler, so it includes `timestamp`, `request_id`, and
        `details.path`/`details.method`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Missing or invalid authorization header
                  timestamp: "2026-07-07T12:00:00.000Z"
                  request_id: "6f1c2c1e-0000-4000-8000-000000000000"
                  details:
                    path: /spotify/playlists
                    method: GET
    ValidationError:
      description: Request parameter validation failed (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidPlaylists:
      description: '`playlist_ids` is missing, empty, or contains empty strings (`INVALID_PLAYLISTS`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ExportUpstreamUnauthorized:
      description: >-
        Missing/invalid JWT or session (see `Unauthorized`), or Spotify
        returned HTTP 401 during export work.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ExportRateLimited:
      description: Spotify returned HTTP 429 during export work
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ExportCpuLimited:
      description: The Worker exceeded its CPU time limit (`details.cpu_limited` is true)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ExportFile:
      description: Export file. Content type matches the export's format.
      headers:
        Content-Disposition:
          schema:
            type: string
          description: 'attachment; filename="<name>_export_<timestamp>.<ext>"'
      content:
        text/csv:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [healthy]
            service:
              type: string
              example: spotibye-backend
            environment:
              type: string
              enum: [development, production]
              description: Value of the `ENVIRONMENT` Worker var
            release_sha:
              type: string
              description: Deployed commit SHA, or `unknown`
            release_version:
              type: string
              description: Deployed release version, or `unknown`
            deployed_at:
              type: string
              description: Deployment timestamp, or `unknown`
            timestamp:
              type: string
              format: date-time
          required:
            - status
            - service
            - environment
            - release_sha
            - release_version
            - deployed_at
            - timestamp
      required:
        - data

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            timestamp:
              type: string
              format: date-time
              description: Set by the global error handler and the 404 handler
            request_id:
              type: string
              description: Set by the global error handler, the 404 handler, and export routes
            details:
              type: object
              additionalProperties: true
              description: >-
                Additional context. The global handler sets `path`/`method`;
                export routes set `upstream`, `upstream_status`,
                `cpu_limited`, and route-specific fields.
          required:
            - code
            - message
      required:
        - error

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
          required:
            - message
      required:
        - data

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        cached:
          type: boolean
          description: Present on Spotify data routes; `true` when served from the backend cache
        request_id:
          type: string
          description: Present on export mutation routes
      required:
        - timestamp

    SpotifyLoginRequest:
      type: object
      properties:
        redirect_uri:
          type: string
          minLength: 1
          description: Must exactly match an entry in `ALLOWED_REDIRECT_URIS`
      required:
        - redirect_uri

    SpotifyLoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            auth_url:
              type: string
              format: uri
              description: Spotify authorization URL (includes PKCE `code_challenge`)
            state:
              type: string
              description: Server-generated state, valid for 10 minutes
          required:
            - auth_url
            - state
      required:
        - data

    SpotifyCallbackResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: App JWT to send as the Bearer token
            user:
              $ref: '#/components/schemas/SpotifyUser'
            expires_in:
              type: integer
              description: App session/JWT lifetime in seconds (30 days)
            spotify_access_expires_in:
              type: integer
              description: Spotify access-token lifetime in seconds
          required:
            - token
            - user
            - expires_in
            - spotify_access_expires_in
      required:
        - data

    TokenRefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: New app JWT
            expires_in:
              type: integer
              description: App session/JWT lifetime in seconds (30 days)
            token_type:
              type: string
              enum: [Bearer]
            spotify_access_expires_in:
              type: integer
              description: Seconds until the stored Spotify access token expires (0 if already expired)
          required:
            - access_token
            - expires_in
            - token_type
            - spotify_access_expires_in
      required:
        - data

    CurrentUserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Spotify user ID
            email:
              type: string
            name:
              type: string
              description: Spotify display name
            session_id:
              type: string
          required:
            - id
            - name
            - session_id
      required:
        - data

    SpotifyUser:
      type: object
      description: Spotify user object, passed through from Spotify
      additionalProperties: true
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
        country:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
      required:
        - id

    Image:
      type: object
      properties:
        url:
          type: string
          format: uri
        height:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
      required:
        - url

    Playlist:
      type: object
      description: >-
        Spotify playlist object, passed through from Spotify. Track counts
        live in `tracks.total` or, under Spotify's February 2026 naming,
        `items.total`.
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        snapshot_id:
          type: string
          description: Spotify playlist revision id; changes when track membership changes
        public:
          type: boolean
        collaborative:
          type: boolean
        owner:
          $ref: '#/components/schemas/SpotifyUser'
        tracks:
          type: object
          additionalProperties: true
          properties:
            href:
              type: string
            total:
              type: integer
        items:
          type: object
          additionalProperties: true
          properties:
            href:
              type: string
            total:
              type: integer
        followers:
          type: object
          properties:
            total:
              type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        external_urls:
          type: object
          properties:
            spotify:
              type: string
              format: uri
        uri:
          type: string
      required:
        - id
        - name

    PlaylistsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    PlaylistResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Playlist'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    PlaylistItemsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            href:
              type: string
            total:
              type: integer
              description: Total items in the playlist, as reported by Spotify
            rawCount:
              type: integer
              description: Entries Spotify returned on this page, before dropping entries without a track ID
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlaylistItem'
          required:
            - total
            - rawCount
            - items
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    PlaylistItem:
      type: object
      description: Spotify playlist item, with the track normalized into `track` (Spotify's `item` field is kept as sent).
      additionalProperties: true
      properties:
        added_at:
          type: string
          format: date-time
        added_by:
          type: object
          allOf:
            - $ref: '#/components/schemas/SpotifyUser'
          nullable: true
        track:
          $ref: '#/components/schemas/Track'
      required:
        - track

    Track:
      type: object
      description: Spotify track object, passed through from Spotify
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        album:
          $ref: '#/components/schemas/Album'
        duration_ms:
          type: integer
        explicit:
          type: boolean
        popularity:
          type: integer
        preview_url:
          type: string
          format: uri
          nullable: true
        external_urls:
          type: object
          properties:
            spotify:
              type: string
              format: uri
        uri:
          type: string
      required:
        - id
        - name
        - artists
        - album

    TrackResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Track'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    Artist:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    Album:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        release_date:
          type: string
      required:
        - id
        - name

    AnalysisRequest:
      type: object
      description: >-
        Optional analysis controls. When `force_enrichment` is true, bypasses
        idempotent completed/queued short-circuit, clears user status/results,
        and clears per-track ReccoBeats positive + absent cache keys for
        playlist track IDs before refetch. When `refresh` is true, also
        bypasses the short-circuit and enqueues a new job, but preserves
        per-track cache and current results so only untried track IDs hit
        the network. A body that fails to parse is treated as empty.
      properties:
        force_enrichment:
          type: boolean
          default: false
          description: >-
            Force-refresh ReccoBeats per-track enrichment for all playlist tracks.
        refresh:
          type: boolean
          default: false
          description: >-
            Enqueue a refresh job reusing warm per-track cache entries.

    AnalysisStatusRecord:
      type: object
      description: Job status record shared by POST /analysis/playlist/{id} and GET /analysis/playlist/{id}/status.
      properties:
        job_id:
          type: string
        playlist_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [queued, processing, retrying, completed, failed]
        progress:
          type: number
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        retry_after:
          type: string
          format: date-time
        attempt:
          type: integer
        error:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - job_id
        - playlist_id
        - user_id
        - status
        - progress

    AnalysisStartResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalysisStatusRecord'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required:
        - data

    AudioFeatureAverages:
      type: object
      properties:
        acousticness:
          type: number
        danceability:
          type: number
        energy:
          type: number
        instrumentalness:
          type: number
        liveness:
          type: number
        loudness:
          type: number
          description: Loudness in decibels (typically negative)
        speechiness:
          type: number
        tempo:
          type: number
          description: Tempo in BPM
        valence:
          type: number
          description: Musical positivity (0 = melancholic, 1 = euphoric)
      required:
        - acousticness
        - danceability
        - energy
        - instrumentalness
        - liveness
        - loudness
        - speechiness
        - tempo
        - valence

    KeyModeDistribution:
      type: object
      description: Omitted entirely when fewer than 2 tracks have a valid key/mode pair.
      properties:
        key_percentages:
          type: object
          additionalProperties:
            type: number
          description: Bare pitch-class labels ("C", "C#", … "B") to percentage of tracks — not display-ready ("C major") on their own.
        dominant_key:
          type: string
        dominant_key_percentage:
          type: number
        mode_percentages:
          type: object
          properties:
            major:
              type: number
            minor:
              type: number
          required:
            - major
            - minor
        dominant_mode:
          type: string
          enum: [major, minor]
      required:
        - key_percentages
        - dominant_key
        - dominant_key_percentage
        - mode_percentages
        - dominant_mode

    AudioFeatureSummary:
      type: object
      properties:
        track_count:
          type: integer
        averages:
          $ref: '#/components/schemas/AudioFeatureAverages'
        key_mode_distribution:
          $ref: '#/components/schemas/KeyModeDistribution'
      required:
        - track_count
        - averages

    ReccoBeatsAnalysisMetadata:
      type: object
      description: >-
        Aggregates from the ReccoBeats track-metadata endpoint.
        `popularity_min`/`popularity_max` are omitted entirely when no track
        has a numeric `popularity`.
      properties:
        isrc_available:
          type: integer
          description: Count of tracks with a non-empty ISRC from ReccoBeats audio features.
        popularity_min:
          type: integer
        popularity_max:
          type: integer
        retrieved_at:
          type: string
          format: date-time
      required:
        - isrc_available
        - retrieved_at

    AnalysisErrorEntry:
      type: object
      properties:
        source:
          type: string
          description: 'e.g. "spotify:artists", "reccobeats:audio-features", "reccobeats:track-metadata"'
        message:
          type: string
      required:
        - source
        - message

    AnalysisResult:
      type: object
      description: ReccoBeats enrichment is always best-effort — `errors` is always present (empty array on full success) rather than failing the whole analysis.
      properties:
        job_id:
          type: string
        playlist_id:
          type: string
        user_id:
          type: string
        status:
          type: string
        computed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        overview:
          type: object
          properties:
            total_tracks:
              type: integer
            total_duration_ms:
              type: integer
            average_duration_ms:
              type: number
            formatted_duration:
              type: string
        artists:
          type: object
          properties:
            unique_artists:
              type: integer
            top_artists:
              type: array
              items:
                $ref: '#/components/schemas/TopArtist'
            diversity:
              type: number
        genre_distribution:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              percentage:
                type: number
        audio_features:
          $ref: '#/components/schemas/AudioFeatureSummary'
        insights:
          type: array
          items:
            type: string
        reccobeats_metadata:
          $ref: '#/components/schemas/ReccoBeatsAnalysisMetadata'
        unique_track_count:
          type: integer
          description: Unique Spotify track IDs in the playlist (duplicates do not inflate this).
        audio_features_resolved_count:
          type: integer
          description: Unique IDs with a ReccoBeats audio-feature hit or endpoint-specific absent sentinel.
        track_metadata_resolved_count:
          type: integer
          description: Unique IDs with a ReccoBeats track-metadata hit or endpoint-specific absent sentinel.
        enrichment_resolved_track_count:
          type: integer
          description: min(audio_features_resolved_count, track_metadata_resolved_count) for display.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisErrorEntry'
        schema_version:
          type: string
          description: Bumped whenever the result shape changes in a way stale cached results can't satisfy; current value "1.1".
      required:
        - job_id
        - playlist_id
        - user_id
        - status
        - computed_at
        - completed_at
        - unique_track_count
        - audio_features_resolved_count
        - track_metadata_resolved_count
        - enrichment_resolved_track_count
        - errors
        - schema_version

    AnalysisResultsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalysisResult'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required:
        - data

    TopArtist:
      type: object
      properties:
        artist:
          type: string
          description: Artist name
        count:
          type: integer
          description: Number of tracks by this artist
      required:
        - artist
        - count

    ExportFormat:
      type: string
      enum: [csv, json, xlsx]
      description: Export format. Missing or unrecognized values fall back to `xlsx`.

    ExportRequest:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/ExportFormat'
        include_audio_features:
          type: boolean
          default: false
          description: >-
            Include ReccoBeats per-track enrichment columns. Only the literal
            `true` enables it.

    SingleExportStatus:
      type: object
      properties:
        job_id:
          type: string
        playlist_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [processing, completed, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        progress:
          type: integer
        file_url:
          type: string
          description: Relative download path
        file_format:
          $ref: '#/components/schemas/ExportFormat'
        include_audio_features:
          type: boolean
        file_size:
          type: integer
          description: Approximate size of the export data in bytes (JSON length)
        track_count:
          type: integer
        error:
          type: string
          description: Present when `status` is `failed`
      required:
        - job_id
        - playlist_id
        - user_id
        - status
        - started_at
        - progress

    SingleExportStatusResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SingleExportStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    BatchExportRequest:
      type: object
      properties:
        playlist_ids:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        format:
          $ref: '#/components/schemas/ExportFormat'
        include_audio_features:
          type: boolean
          default: false
          description: Include ReccoBeats per-track enrichment columns (literal `true` only)
      required:
        - playlist_ids

    BatchExportChunkRequest:
      allOf:
        - $ref: '#/components/schemas/BatchExportRequest'
        - type: object
          properties:
            job_id:
              type: string
              description: Job ID from a previous chunk call. Omit on the first call.
            cursor:
              type: integer
              minimum: 0
              default: 0
              description: Index of the next playlist to process
            chunk_size:
              type: integer
              minimum: 1
              maximum: 3
              default: 1
              description: Playlists to process in this call (clamped to 1-3)

    BatchExportStatus:
      type: object
      properties:
        job_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [processing, completed, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        progress:
          type: integer
        file_url:
          type: string
          description: Relative download path, set once completed
        file_format:
          $ref: '#/components/schemas/ExportFormat'
        file_size:
          type: integer
        playlist_count:
          type: integer
        processed_count:
          type: integer
          description: Chunked exports only
        track_count:
          type: integer
        playlist_ids:
          type: array
          items:
            type: string
        next_cursor:
          type: integer
          description: Chunked exports only
        continuation_required:
          type: boolean
          description: Chunked exports only; true while more chunks remain
        error:
          type: string
      required:
        - job_id
        - user_id
        - status
        - started_at
        - progress
        - file_format
        - playlist_count
        - track_count
        - playlist_ids

    BatchExportStatusResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BatchExportStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    ExportJobStepRequest:
      type: object
      properties:
        cursor:
          type: string
          description: The job's current `current_cursor`
        resume_token:
          type: string
          description: The job's current `current_resume_token`
        max_playlists_per_step:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: Playlists to process per step (clamped to 1-3)
        chunk_size:
          type: integer
          minimum: 1
          maximum: 3
          description: Alias used when `max_playlists_per_step` is absent

    ExportJobState:
      type: object
      additionalProperties: true
      properties:
        job_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [running, assembling, completed, failed]
        phase:
          type: string
          enum: [collect, assemble]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        playlist_ids:
          type: array
          items:
            type: string
        playlist_count:
          type: integer
        processed_count:
          type: integer
        track_count:
          type: integer
        file_format:
          $ref: '#/components/schemas/ExportFormat'
        include_audio_features:
          type: boolean
        current_cursor:
          type: string
        current_resume_token:
          type: string
        next_playlist_index:
          type: integer
        current_track_offset:
          type: integer
        assemble_index:
          type: integer
        track_page_size:
          type: integer
        playlist_progress:
          type: object
          additionalProperties:
            type: object
            properties:
              next_offset:
                type: integer
              total_tracks:
                type: integer
              collected_tracks:
                type: integer
              done:
                type: boolean
        continuation_required:
          type: boolean
        progress:
          type: integer
        file_url:
          type: string
        file_size:
          type: integer
        last_error:
          type: string
        trace_id:
          type: string
        render_mode_hint:
          type: string
          enum: [rich, lite]
        render_warning:
          type: string
      required:
        - job_id
        - user_id
        - status
        - phase
        - created_at
        - updated_at
        - playlist_ids
        - playlist_count
        - processed_count
        - track_count
        - file_format
        - include_audio_features
        - current_cursor
        - current_resume_token
        - continuation_required
        - progress

    ExportJobResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExportJobState'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

    ExportJobStatusResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/ExportJobState'
            - type: object
              properties:
                available_render_modes:
                  type: object
                  properties:
                    default:
                      type: boolean
                    lite:
                      type: boolean
                    rich:
                      type: boolean
                  required:
                    - default
                    - lite
                    - rich
              required:
                - available_render_modes
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - data

tags:
  - name: System
    description: System health and deployment metadata
  - name: Authentication
    description: Spotify OAuth (PKCE) and session endpoints
  - name: Spotify Data
    description: Endpoints for retrieving Spotify data
  - name: Analysis
    description: Asynchronous playlist analysis endpoints
  - name: Export
    description: Single, combined, chunked, and resumable playlist export endpoints
