openapi: 3.0.3
info:
  title: SpotiBye API
  description: Cloudflare Workers backend for Spotify playlist analysis and export functionality
  version: 1.0.0
  contact:
    name: SpotiBye Team
    email: support@spotibye.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://spotibye-api.workers.dev
    description: Production server
  - url: https://spotibye-api-dev.workers.dev
    description: Development server
  - url: http://localhost:8787
    description: Local development server

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns the current health status of the API
      operationId: getHealth
      responses:
        '200':
          description: API is healthy and ready to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy response
                  value:
                    status: healthy
                    timestamp: "2023-12-12T23:00:00Z"
                    version: "1.0.0"

  /auth/spotify/login:
    post:
      tags:
        - Authentication
      summary: Initiate Spotify OAuth flow
      description: Starts the OAuth authentication process with Spotify
      operationId: spotifyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotifyLoginRequest'
            examples:
              standard:
                summary: Standard login request
                value:
                  redirect_uri: "http://localhost:3000/callback"
                  state: "random-state-string"
      responses:
        '200':
          description: OAuth URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotifyLoginResponse'
              examples:
                success:
                  summary: Successful login initiation
                  value:
                    data:
                      auth_url: "https://accounts.spotify.com/authorize?response_type=code&client_id=..."
                      state: "random-state-string"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/spotify/callback:
    get:
      tags:
        - Authentication
      summary: Handle Spotify OAuth callback
      description: Processes the OAuth callback from Spotify and returns JWT tokens
      operationId: spotifyCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Spotify
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: State parameter for CSRF protection
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Error parameter if OAuth failed
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotifyCallbackResponse'
              examples:
                success:
                  summary: Successful authentication
                  value:
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "refresh-token-string"
                      expires_in: 3600
                      user:
                        id: "user-123"
                        display_name: "Test User"
                        email: "test@example.com"
        '400':
          description: Invalid callback parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists:
    get:
      tags:
        - Spotify Data
      summary: Get user's playlists
      description: Retrieves all playlists for the authenticated user
      operationId: getUserPlaylists
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 50
          description: Maximum number of playlists to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Offset for pagination
      responses:
        '200':
          description: Playlists retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistsResponse'
              examples:
                success:
                  summary: Successful playlists retrieval
                  value:
                    data:
                      playlists:
                        - id: "playlist-123"
                          name: "My Favorite Songs"
                          tracks_count: 100
                          owner: "Test User"
                          images:
                            - url: "https://example.com/image.jpg"
                              height: 300
                              width: 300
                      total: 1
                      limit: 50
                      offset: 0
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists/{id}:
    get:
      tags:
        - Spotify Data
      summary: Get playlist details
      description: Retrieves detailed information about a specific playlist
      operationId: getPlaylist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      responses:
        '200':
          description: Playlist details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
              examples:
                success:
                  summary: Successful playlist retrieval
                  value:
                    data:
                      playlist:
                        id: "playlist-123"
                        name: "My Favorite Songs"
                        description: "My favorite tracks"
                        tracks_count: 100
                        owner: "Test User"
                        followers: 42
                        public: true
                        collaborative: false
                        images:
                          - url: "https://example.com/image.jpg"
                            height: 300
                            width: 300
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spotify/playlists/{id}/items:
    get:
      tags:
        - Spotify Data
      summary: Get playlist items
      description: Retrieves playlist items from a specific playlist (Spotify February 2026 naming)
      operationId: getPlaylistItems
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Maximum number of playlist items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Offset for pagination
      responses:
        '200':
          description: Playlist items retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItemsResponse'
              examples:
                success:
                  summary: Successful playlist items retrieval
                  value:
                    data:
                      items:
                        - added_at: "2026-03-01T10:00:00Z"
                          track:
                            id: "track-123"
                            name: "Example Song"
                            artists:
                              - name: "Example Artist"
                                id: "artist-123"
                            album:
                              name: "Example Album"
                              id: "album-123"
                            duration_ms: 180000
                            track_number: 1
                            explicit: false
                            preview_url: "https://example.com/preview.mp3"
                            external_urls:
                              spotify: "https://open.spotify.com/track/track-123"
                      total: 100
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}:
    post:
      tags:
        - Analysis
      summary: Start (or resume) playlist analysis
      description: >-
        Starts an asynchronous ReccoBeats + Spotify playlist analysis job and
        returns its status record. The request body is currently ignored —
        analysis always runs with default settings. If a job for this
        playlist is already queued, actively processing, or completed with
        results matching the current schema_version, that existing status is
        returned instead of enqueuing a duplicate job. A completed status
        whose results are missing or predate the current schema_version is
        treated as stale: it is purged and a fresh job is enqueued.
      operationId: analyzePlaylist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: Current or newly-queued job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStartResponse'
              examples:
                queued:
                  summary: Newly queued job
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: queued
                      queued_at: "2026-07-07T12:00:00.000Z"
                      progress: 0
                    meta:
                      timestamp: "2026-07-07T12:00:00.000Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}/status:
    get:
      tags:
        - Analysis
      summary: Get analysis job status
      description: Returns the current status record for the most recent analysis job on this playlist for the authenticated user.
      operationId: getAnalysisStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      responses:
        '200':
          description: Current job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStartResponse'
              examples:
                processing:
                  summary: Job in progress
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: processing
                      progress: 65
                    meta:
                      timestamp: "2026-07-07T12:00:05.000Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No analysis found for this playlist (ANALYSIS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get analysis status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/playlist/{id}/results:
    get:
      tags:
        - Analysis
      summary: Get analysis results
      description: >-
        Returns the completed analysis result for this playlist. Results
        missing `schema_version`, or whose `schema_version` predates the
        server's current version, are purged (both the results and job
        status KV entries) and reported as ANALYSIS_RESULTS_NOT_FOUND so the
        client re-triggers a fresh analysis via POST.
      operationId: getAnalysisResults
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      responses:
        '200':
          description: Completed analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultsResponse'
              examples:
                success:
                  summary: Completed analysis with ReccoBeats enrichment
                  value:
                    data:
                      job_id: "job-123"
                      playlist_id: "playlist-123"
                      user_id: "user-123"
                      status: completed
                      computed_at: "2026-07-07T12:00:00.000Z"
                      completed_at: "2026-07-07T12:00:10.000Z"
                      overview:
                        total_tracks: 100
                        total_duration_ms: 21600000
                        average_duration_ms: 216000
                        formatted_duration: "6h 0m 0s"
                      artists:
                        unique_artists: 42
                        top_artists:
                          - artist: "Artist One"
                            count: 8
                          - artist: "Artist Two"
                            count: 5
                        diversity: 0.42
                      genre_distribution:
                        Pop:
                          count: 30
                          percentage: 30.0
                        Electronic:
                          count: 20
                          percentage: 20.0
                      audio_features:
                        track_count: 100
                        averages:
                          acousticness: 0.25
                          danceability: 0.82
                          energy: 0.75
                          instrumentalness: 0.15
                          liveness: 0.2
                          loudness: -6.0
                          speechiness: 0.05
                          tempo: 128.5
                          valence: 0.68
                        key_mode_distribution:
                          key_percentages:
                            C: 42.0
                            G: 30.0
                          dominant_key: "C"
                          dominant_key_percentage: 42.0
                          mode_percentages:
                            major: 70.0
                            minor: 30.0
                          dominant_mode: major
                      insights:
                        - "Top genres: Pop, Electronic."
                      reccobeats_metadata:
                        isrc_available: 95
                        popularity_min: 20
                        popularity_max: 90
                        retrieved_at: "2026-07-07T12:00:09.000Z"
                      errors: []
                      schema_version: "1.1"
                      unique_track_count: 100
                      audio_features_resolved_count: 100
                      track_metadata_resolved_count: 98
                      enrichment_resolved_track_count: 98
                    meta:
                      timestamp: "2026-07-07T12:00:11.000Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No results found, or cached results are stale (ANALYSIS_RESULTS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlist/{id}:
    post:
      tags:
        - Export
      summary: Generate playlist export
      description: Creates an export file for the specified playlist
      operationId: exportPlaylist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            examples:
              csv:
                summary: CSV export request
                value:
                  format: "csv"
                  include_audio_features: true
                  include_analysis: false
              json:
                summary: JSON export request
                value:
                  format: "json"
                  include_audio_features: true
                  include_analysis: true
      responses:
        '200':
          description: Export generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              examples:
                success:
                  summary: Successful export generation
                  value:
                    data:
                      export_id: "export-123"
                      format: "csv"
                      estimated_size: 1024000
                      expires_at: "2023-12-13T23:00:00Z"
                      download_url: "/export/playlist/playlist-123/download?export_id=export-123"
        '400':
          description: Invalid export parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Export generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /export/playlist/{id}/download:
    get:
      tags:
        - Export
      summary: Download export file
      description: Downloads a previously generated export file
      operationId: downloadExport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
        - name: export_id
          in: query
          required: true
          schema:
            type: string
          description: Export file ID
      responses:
        '200':
          description: Export file downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              examples:
                csv:
                  summary: CSV file download
                  value:
                    schema:
                      type: string
                      format: binary
                    headers:
                      Content-Disposition: "attachment; filename=\"playlist-export.csv\""
                      Content-Type: "text/csv"
        '400':
          description: Invalid export ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Export file not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Export file has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Spotify OAuth callback

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Health status of the API
        timestamp:
          type: string
          format: date-time
          description: Current timestamp
        version:
          type: string
          description: API version
      required:
        - status
        - timestamp
        - version

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error details
      required:
        - error

    SpotifyLoginRequest:
      type: object
      properties:
        redirect_uri:
          type: string
          format: uri
          description: URL to redirect to after OAuth completion
        state:
          type: string
          description: State parameter for CSRF protection
      required:
        - redirect_uri

    SpotifyLoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            auth_url:
              type: string
              format: uri
              description: Spotify authorization URL
            state:
              type: string
              description: State parameter
      required:
        - data

    SpotifyCallbackResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: JWT refresh token
            expires_in:
              type: integer
              description: Token expiration time in seconds
            user:
              type: object
              properties:
                id:
                  type: string
                  description: Spotify user ID
                display_name:
                  type: string
                  description: User's display name
                email:
                  type: string
                  format: email
                  description: User's email
              required:
                - id
                - display_name
      required:
        - data

    PlaylistsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            playlists:
              type: array
              items:
                $ref: '#/components/schemas/Playlist'
            total:
              type: integer
              description: Total number of playlists
            limit:
              type: integer
              description: Number of playlists returned
            offset:
              type: integer
              description: Offset for pagination
          required:
            - playlists
            - total
            - limit
            - offset
      required:
        - data

    Playlist:
      type: object
      properties:
        id:
          type: string
          description: Spotify playlist ID
        name:
          type: string
          description: Playlist name
        description:
          type: string
          description: Playlist description
        tracks_count:
          type: integer
          description: Number of tracks in playlist
        owner:
          type: string
          description: Playlist owner name
        followers:
          type: integer
          description: Number of followers
        public:
          type: boolean
          description: Whether playlist is public
        collaborative:
          type: boolean
          description: Whether playlist is collaborative
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
      required:
        - id
        - name
        - tracks_count
        - owner

    Image:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Image URL
        height:
          type: integer
          description: Image height in pixels
        width:
          type: integer
          description: Image width in pixels
      required:
        - url

    PlaylistResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            playlist:
              $ref: '#/components/schemas/Playlist'
      required:
        - data

    PlaylistItemsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlaylistItem'
            total:
              type: integer
              description: Total number of playlist items
          required:
            - items
            - total
      required:
        - data

    PlaylistItem:
      type: object
      properties:
        added_at:
          type: string
          format: date-time
          description: Timestamp the item was added to the playlist
        track:
          $ref: '#/components/schemas/Track'
      required:
        - track

    Track:
      type: object
      properties:
        id:
          type: string
          description: Spotify track ID
        name:
          type: string
          description: Track name
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        album:
          $ref: '#/components/schemas/Album'
        duration_ms:
          type: integer
          description: Track duration in milliseconds
        track_number:
          type: integer
          description: Track number on album
        explicit:
          type: boolean
          description: Whether track is explicit
        preview_url:
          type: string
          format: uri
          description: Preview URL for track
        external_urls:
          type: object
          properties:
            spotify:
              type: string
              format: uri
              description: Spotify URL for track
      required:
        - id
        - name
        - artists
        - album
        - duration_ms

    Artist:
      type: object
      properties:
        id:
          type: string
          description: Spotify artist ID
        name:
          type: string
          description: Artist name
      required:
        - id
        - name

    Album:
      type: object
      properties:
        id:
          type: string
          description: Spotify album ID
        name:
          type: string
          description: Album name
      required:
        - id
        - name

    ApiEnvelope:
      type: object
      description: >-
        Shared success-response shape used across the API: `data` holds the
        endpoint-specific payload and `meta.timestamp` is always an ISO-8601
        string. Endpoint-specific response schemas (e.g.
        AnalysisStartResponse, AnalysisResultsResponse) follow this same
        envelope with a concrete `data` schema instead of `type: object`.
      properties:
        data:
          type: object
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required:
        - data

    AnalysisRequest:
      type: object
      description: >-
        Currently ignored — POST /analysis/playlist/{id} always starts (or
        returns the status of) an analysis job with default settings. Kept
        as an empty schema so the request body remains documented as
        optional JSON rather than implying unused fields exist.
      properties: {}

    AnalysisStatusRecord:
      type: object
      description: Job status record shared by POST /analysis/playlist/{id} and GET /analysis/playlist/{id}/status.
      properties:
        job_id:
          type: string
        playlist_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [queued, processing, retrying, completed, failed]
        progress:
          type: number
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        retry_after:
          type: string
          format: date-time
        attempt:
          type: integer
        error:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - job_id
        - playlist_id
        - user_id
        - status
        - progress

    AnalysisStartResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalysisStatusRecord'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required:
        - data

    AudioFeatureAverages:
      type: object
      properties:
        acousticness:
          type: number
        danceability:
          type: number
        energy:
          type: number
        instrumentalness:
          type: number
        liveness:
          type: number
        loudness:
          type: number
          description: Loudness in decibels (typically negative)
        speechiness:
          type: number
        tempo:
          type: number
          description: Tempo in BPM
        valence:
          type: number
          description: Musical positivity (0 = melancholic, 1 = euphoric)
      required:
        - acousticness
        - danceability
        - energy
        - instrumentalness
        - liveness
        - loudness
        - speechiness
        - tempo
        - valence

    KeyModeDistribution:
      type: object
      description: Omitted entirely when fewer than 2 tracks have a valid key/mode pair.
      properties:
        key_percentages:
          type: object
          additionalProperties:
            type: number
          description: Bare pitch-class labels ("C", "C#", … "B") to percentage of tracks — not display-ready ("C major") on their own.
        dominant_key:
          type: string
        dominant_key_percentage:
          type: number
        mode_percentages:
          type: object
          properties:
            major:
              type: number
            minor:
              type: number
          required:
            - major
            - minor
        dominant_mode:
          type: string
          enum: [major, minor]
      required:
        - key_percentages
        - dominant_key
        - dominant_key_percentage
        - mode_percentages
        - dominant_mode

    AudioFeatureSummary:
      type: object
      properties:
        track_count:
          type: integer
        averages:
          $ref: '#/components/schemas/AudioFeatureAverages'
        key_mode_distribution:
          $ref: '#/components/schemas/KeyModeDistribution'
      required:
        - track_count
        - averages

    ReccoBeatsAnalysisMetadata:
      type: object
      description: >-
        Aggregates from the ReccoBeats track-metadata endpoint.
        `popularity_min`/`popularity_max` are omitted entirely when no track
        has a numeric `popularity`.
      properties:
        isrc_available:
          type: integer
          description: Count of tracks with a non-empty ISRC from ReccoBeats audio features.
        popularity_min:
          type: integer
        popularity_max:
          type: integer
        retrieved_at:
          type: string
          format: date-time
      required:
        - isrc_available
        - retrieved_at

    AnalysisErrorEntry:
      type: object
      properties:
        source:
          type: string
          description: 'e.g. "spotify:artists", "reccobeats:audio-features", "reccobeats:track-metadata"'
        message:
          type: string
      required:
        - source
        - message

    AnalysisResult:
      type: object
      description: ReccoBeats enrichment is always best-effort — `errors` is always present (empty array on full success) rather than failing the whole analysis.
      properties:
        job_id:
          type: string
        playlist_id:
          type: string
        user_id:
          type: string
        status:
          type: string
        computed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        overview:
          type: object
          properties:
            total_tracks:
              type: integer
            total_duration_ms:
              type: integer
            average_duration_ms:
              type: number
            formatted_duration:
              type: string
        artists:
          type: object
          properties:
            unique_artists:
              type: integer
            top_artists:
              type: array
              items:
                $ref: '#/components/schemas/TopArtist'
            diversity:
              type: number
        genre_distribution:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              percentage:
                type: number
        audio_features:
          $ref: '#/components/schemas/AudioFeatureSummary'
        insights:
          type: array
          items:
            type: string
        reccobeats_metadata:
          $ref: '#/components/schemas/ReccoBeatsAnalysisMetadata'
        unique_track_count:
          type: integer
          description: Unique Spotify track IDs in the playlist (duplicates do not inflate this).
        audio_features_resolved_count:
          type: integer
          description: Unique IDs with a ReccoBeats audio-feature hit or endpoint-specific absent sentinel.
        track_metadata_resolved_count:
          type: integer
          description: Unique IDs with a ReccoBeats track-metadata hit or endpoint-specific absent sentinel.
        enrichment_resolved_track_count:
          type: integer
          description: min(audio_features_resolved_count, track_metadata_resolved_count) for display.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisErrorEntry'
        schema_version:
          type: string
          description: Bumped whenever the result shape changes in a way stale cached results can't satisfy; current value "1.1".
      required:
        - job_id
        - playlist_id
        - user_id
        - status
        - computed_at
        - completed_at
        - unique_track_count
        - audio_features_resolved_count
        - track_metadata_resolved_count
        - enrichment_resolved_track_count
        - errors
        - schema_version

    AnalysisResultsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalysisResult'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required:
        - data

    TopArtist:
      type: object
      properties:
        artist:
          type: string
          description: Artist name
        count:
          type: integer
          description: Number of tracks by this artist
      required:
        - artist
        - count

    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum: [csv, json, xlsx]
          description: Export format
        include_audio_features:
          type: boolean
          default: true
          description: Whether to include audio features
        include_analysis:
          type: boolean
          default: false
          description: Whether to include analysis data
      required:
        - format

    ExportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            export_id:
              type: string
              description: Unique export file ID
            format:
              type: string
              description: Export format
            estimated_size:
              type: integer
              description: Estimated file size in bytes
            expires_at:
              type: string
              format: date-time
              description: When export file expires
            download_url:
              type: string
              description: URL to download the export
          required:
            - export_id
            - format
            - estimated_size
            - expires_at
            - download_url
      required:
        - data

tags:
  - name: System
    description: System health and status endpoints
  - name: Authentication
    description: Spotify OAuth authentication endpoints
  - name: Spotify Data
    description: Endpoints for retrieving Spotify data
  - name: Analysis
    description: Playlist analysis and insights endpoints
  - name: Export
    description: Playlist export functionality endpoints
