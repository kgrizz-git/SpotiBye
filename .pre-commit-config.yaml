exclude: |
  (?x)^(
    \.venv/|
    venv/|
    node_modules/|
    build/|
    dist/|
    backups/|
    backend-backup/|
    SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY/|
    docs/old-docs-backup/|
    srcamas/
  )

repos:
  # Secret scanning - prevent secrets from being committed
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Gitleaks - comprehensive secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        description: Detect hardcoded secrets using Gitleaks

  # Semgrep - secrets only on commit (fast, no network); full SAST scan deferred to pre-push and CI
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.59.0
    hooks:
      - id: semgrep
        name: Semgrep Secrets (pre-commit)
        description: Fast secrets-only scan on commit; full SAST runs pre-push and in CI
        args: ['--config=p/secrets', '--error', '--skip-unknown-extensions']
        exclude: '^tests/|^docs/|^src/backend/docs/|^\.venv/|^venv/|^node_modules/|^build/|^dist/|^backups/|^backend-backup/|^SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY/|^docs/old-docs-backup/|^srcamas/'
        stages: [pre-commit]

  # Python security (Bandit) - only on Python files
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: Bandit Python Security
        description: Security linter for Python code
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        files: ".+\\.py$"
        stages: [pre-commit]

  # Python linting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  # Node.js linting (ESLint) - only on JS/TS files
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.4.0
    hooks:
      - id: eslint
        name: ESLint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.57.0
          - "@typescript-eslint/eslint-plugin@6.0.0"
          - "@typescript-eslint/parser@6.0.0"

  # Repo structure guardrails (pre-commit)
  - repo: local
    hooks:
      - id: check-repo-structure
        name: Check repo structure conventions
        entry: scripts/check-repo-structure.sh
        language: script
        pass_filenames: false

      # Prune stale code backups (older than 5 commits) so backups/ stays lean.
      # On prune, the deletion is staged and pre-commit aborts; re-run the commit.
      - id: prune-backups
        name: Prune stale code backups
        description: Remove backups/ files older than 5 commits before committing
        entry: scripts/prune-backups.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Pre-push hooks - longer running checks
  # These run before git push, not on every commit

  # Run tests before push
  - repo: local
    hooks:
      - id: python-tests
        name: Python Tests
        description: Run Python test suite before push
        entry: python -m pytest src/frontend/tests -v --tb=long
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: node-tests
        name: Node.js Tests
        description: Run Node.js test suite before push
        entry: bash -c 'cd src/backend && npm run test:run'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Full Semgrep SAST before push (mirrors CI ruleset)
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.59.0
    hooks:
      - id: semgrep
        name: Semgrep SAST (pre-push)
        description: Full SAST scan matching CI — OWASP Top 10, CWE Top 25, JS/TS/Python
        args: ['--config=p/security-audit', '--config=p/owasp-top-ten', '--config=p/cwe-top-25', '--error', '--skip-unknown-extensions']
        exclude: '^tests/|^docs/|^src/backend/docs/|^\.venv/|^venv/|^node_modules/|^build/|^dist/|^backups/|^backend-backup/|^SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY/|^docs/old-docs-backup/|^srcamas/'
        stages: [pre-push]

  # Comprehensive security scan before push
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Python Security (pre-push)
        description: Full-tree Bandit scan before push; uses project policy in pyproject.toml
        entry: bandit -r src/ -c pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: security-scan
        name: Full Security Scan
        description: Run comprehensive security checks before push
        entry: python scripts/check-dependencies.py --security --ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Dependency vulnerability scan (OSV-Scanner) before push.
  # Uses the native (Go) hook: pre-commit (>=3.0) bootstraps Go automatically,
  # so no local Docker or Go install is required. OSV-Scanner honours .gitignore
  # by default, so .venv/, node_modules/, backups/, etc. are skipped already.
  - repo: https://github.com/google/osv-scanner
    rev: v2.3.5
    hooks:
      - id: osv-scanner
        name: OSV-Scanner (pre-push)
        stages: [pre-push]
        args:
          - "scan"
          - "source"
          - "--format=vertical"
          - "--recursive"
          - "--verbosity=error"
          - "."

  # Python type checking (basedpyright) before push
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright type check
        description: Run basedpyright type checker on frontend and shared code before push
        entry: basedpyright src/frontend src/shared --level error
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
