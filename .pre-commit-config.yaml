exclude: |
  (?x)^(?:\.venv/|
         venv/|
         node_modules/|
         build/|
         dist/|
         backups/)

repos:
  # Secret scanning - prevent secrets from being committed
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  # Gitleaks - comprehensive secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        description: Detect hardcoded secrets using Gitleaks
        stages: [pre-commit]

  # Semgrep - secrets on staged files at commit; full SAST scan deferred to pre-push and CI
  - repo: local
    hooks:
      - id: semgrep-secrets
        name: Semgrep Secrets (pre-commit)
        description: Secrets scan on staged files only; full SAST runs pre-push and in CI
        entry: semgrep --config=p/secrets --error --skip-unknown-extensions
        language: system
        files: \.(py|ts|tsx|js|jsx|json|ya?ml|toml|md|sh|env|ini|cfg|conf)$
        types: [file]
        pass_filenames: true
        stages: [pre-commit]

  # Python linting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff Formatter
        stages: [pre-commit]

  # Node.js linting (ESLint) - only on JS/TS files
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'npx eslint -c src/backend/eslint.config.mjs "$@"' --
        language: system
        files: ^src/backend/.*\.[jt]sx?$
        types: [file]
        stages: [pre-commit]

  # Repo structure guardrails (pre-commit)
  - repo: local
    hooks:
      - id: check-repo-structure
        name: Check repo structure conventions
        entry: scripts/check-repo-structure.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # Prune stale code backups (older than 5 commits) so backups/ stays lean.
      # On prune, the deletion is staged and pre-commit aborts; re-run the commit.
      - id: prune-backups
        name: Prune stale code backups
        description: Remove backups/ files older than 5 commits before committing
        entry: scripts/prune-backups.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # File length check (Phase A: warn-only; switches to enforcement after 14 days)
      - id: file-length-check
        name: File length check
        description: Warn when .py/.md files exceed line limits (700 code / 1000 test / 300 doc)
        entry: .venv/bin/python scripts/check_file_lengths.py --exemptions scripts/file-length-exemptions.json --warn
        language: system
        files: \.(py|md)$
        types: [file]
        pass_filenames: true
        stages: [pre-commit]

  # Pre-push hooks - longer running checks
  # These run before git push, not on every commit

  # Run tests before push
  - repo: local
    hooks:
      - id: python-tests
        name: Python Tests
        description: Run Python test suite before push
        entry: bash -c 'KIVY_WINDOW=headless KIVY_NO_ENV_CONFIG=1 .venv/bin/python -m pytest src/frontend/tests -v --tb=long'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: node-tests
        name: Node.js Tests
        description: Run Node.js test suite before push
        entry: bash -c 'cd src/backend && npm run test:run'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: node-typecheck
        name: Node.js Type Check
        description: Run tsc --noEmit on the backend before push (mirrors CI Backend (TypeScript) job)
        entry: bash -c 'cd src/backend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Full Semgrep SAST before push (mirrors CI ruleset)
  - repo: local
    hooks:
      - id: semgrep-sast
        name: Semgrep SAST (pre-push)
        description: Full SAST scan matching CI — OWASP Top 10, CWE Top 25, plus JavaScript/TypeScript language packs (catches rules like unsafe-formatstring that the secrets-only pre-commit hook misses)
        entry: semgrep --config=p/security-audit --config=p/owasp-top-ten --config=p/cwe-top-25 --config=p/javascript --config=p/typescript --config=p/python --error --skip-unknown-extensions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Comprehensive security scan before push
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Python Security (pre-push)
        description: Full-tree Bandit scan before push; uses project policy in pyproject.toml
        entry: bandit -r src/ scripts/ -c pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Dependency vulnerability scan (OSV-Scanner) before push.
  # This is the canonical local dependency vulnerability check. Keep dependency
  # CVE scanning here to avoid duplicating pip-audit/npm-audit hooks alongside
  # OSV, while still preserving scripts/check-dependencies.py for ad hoc use.
  # Uses the native (Go) hook: pre-commit (>=3.0) bootstraps Go automatically,
  # so no local Docker or Go install is required. OSV-Scanner honours .gitignore
  # by default, so .venv/, node_modules/, backups/, etc. are skipped already.
  - repo: https://github.com/google/osv-scanner
    rev: v2.3.8
    hooks:
      - id: osv-scanner
        name: OSV-Scanner (pre-push)
        stages: [pre-push]
        args:
          - "scan"
          - "source"
          - "--format=vertical"
          - "--recursive"
          - "--verbosity=error"
          - "."

  # Python type checking (basedpyright) before push
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright type check
        description: Run basedpyright type checker on frontend, shared, and scripts code before push
        entry: basedpyright src/frontend src/shared scripts --level error
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
