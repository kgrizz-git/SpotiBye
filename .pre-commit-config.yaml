exclude: |
  (?x)^(
    \.venv/|
    venv/|
    node_modules/|
    build/|
    dist/|
    backups/|
    backend-backup/|
    SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY/|
    docs/old-docs-backup/|
    srcamas/
  )

repos:
  # Secret scanning - prevent secrets from being committed
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Gitleaks - comprehensive secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        description: Detect hardcoded secrets using Gitleaks

  # Semgrep - lightweight SAST
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.59.0
    hooks:
      - id: semgrep
        name: Semgrep SAST
        description: Run Semgrep static analysis
        args: ['--config=auto', '--error', '--skip-unknown-extensions']
        exclude: '^tests/|^docs/|^src/backend/docs/|^\.venv/|^venv/|^node_modules/|^build/|^dist/|^backups/|^backend-backup/|^SpotifyPlaylistExporterV2-BACKUP-COPY-READ-ONLY/|^docs/old-docs-backup/|^srcamas/'
        stages: [pre-commit]

  # Python security (Bandit) - only on Python files
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: Bandit Python Security
        description: Security linter for Python code
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        files: ".+\\.py$"

  # Python linting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  # Node.js linting (ESLint) - only on JS/TS files
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.4.0
    hooks:
      - id: eslint
        name: ESLint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.57.0
          - "@typescript-eslint/eslint-plugin@6.0.0"
          - "@typescript-eslint/parser@6.0.0"

  # Pre-push hooks - longer running checks
  # These run before git push, not on every commit

  # Run tests before push
  - repo: local
    hooks:
      - id: python-tests
        name: Python Tests
        description: Run Python test suite before push
        entry: python -m pytest src/frontend/tests -v --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: node-tests
        name: Node.js Tests
        description: Run Node.js test suite before push
        entry: bash -c 'cd src/backend && npm run test:run'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Comprehensive security scan before push
  - repo: local
    hooks:
      - id: security-scan
        name: Full Security Scan
        description: Run comprehensive security checks before push
        entry: python scripts/check-dependencies.py --security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
